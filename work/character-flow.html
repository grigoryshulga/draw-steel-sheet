орчей, огнем, молнией, ядом или звуком, впервые понимает что находится с вами в бою, если у него П < СИЛЬНЫЙ, оно напугано вами (до прох.).\n\nДополнительно, когда вы используете Первозданный удар, вы можете потратить вплоть до 3 свирепости, получая 1 всплеск за каждую потраченную свирепость для использования в этом ударе.\n\n---\n"}, {"name": "Увеличение характеристик", "text": "#### Увеличение характеристик\nВаши показатели Мощи и Ловкости каждый увеличивается до 5.\n\n---\n"}, {"name": "Улучшение растущей свирепости", "text": "#### Улучшение растущей свирепости\nВаша Особенность Растущая свирепость предоставляет дополнительные преимущества, когда у вас есть 12 или более свирепости.\n\n---\n"}, {"name": "Перк", "text": "#### Перк\nВы получаете один перк ремесла, исследования или интриги по вашему выбору.\n\n---\n"}, {"name": "Первозданная свирепость", "text": "#### Первозданная свирепость\nВ первый раз, когда вы получаете урон в каждом раунде боя, вы получаете 3 свирепости вместо 2.\n\n---\n"}, {"name": "Первозданная сила", "text": "#### Первозданная сила\nУ вас есть эпический ресурс, называемый первозданной силой. Каждый раз, когда вы заканчиваете отдых, вы получаете первозданную силу, равную полученному вами Опыту. Вы можете тратить первозданную силу на свои способности так, как если бы это была свирепость.\n\nДополнительно, вы можете потратить любое количество первозданной силы как свободный маневр, завершая один эффект на вас за каждую потраченную первозданную силу.\n\nВы также можете потратить 3 первозданной силы, чтобы создать портал в Квинтэссенцию, не нуждаясь в источнике элементальной силы.\n\nПервозданная сила сохраняется, пока вы ее не потратите.\n\n---\n"}]]}], "ancestries": [{"name": "Дьявол", "summary": "Обладающие адским происхождением, дьяволы — гуманоиды с красной или синей кожей, выраженной в широком разнообразии оттенков, от ярко-алого до глубокого фиолетового. Каждый дьявол рождается с какой-то адской меткой — рогами, хвостом, раздвоенными копытами, раздвоенным языком, клыками или даже крыльями. Легенда их происхождения варьируется от сеттинга к сеттингу. Пример официального сеттинга Draw Steel:", "budget": 3, "traits": [{"name": "Колючий хвост", "cost": 1, "text": "ваш заостренный хвост позволяет вам подчеркивать все ваши действия. Один раз за раунд, когда вы наносите удар в ближнем бою, вы можете нанести дополнительный урон этим ударом равный значению вашей сильнейшей характеристики.", "id": "feature.trait.devil.barbed-tail", "originalId": "mcdm.heroes.v1/feature.trait.devil/barbed-tail", "originalName": "Barbed Tail", "originalDescription": "Your pointy tail allows you to punctuate all your actions. Once per round when you make a melee strike, you can deal extra damage with the strike equal to your highest characteristic score."}, {"name": "Звериные ноги", "cost": 1, "text": "ваши мощные ноги делают вас заметно быстрее. Ваша скорость равна 6.", "id": "feature.trait.devil.beast-legs", "originalId": "mcdm.heroes.v1/feature.trait.devil/beast-legs", "originalName": "Beast Legs", "originalDescription": "Your powerful legs make you faster. You have speed 6."}, {"name": "Светящиеся глаза", "cost": 1, "text": "ваши глаза сплошного, яркого цвета, который вспыхивает, показывая ваше возбуждение или ярость. Всякий раз, когда вы получаете урон от существа, вы можете использовать триггер, чтобы проклясть это существо за то, что оно посмело причинить вам вред. Существо получает 1d10 + ваш уровень психического урона.", "id": "feature.trait.devil.glowing-eyes", "originalId": "mcdm.heroes.v1/feature.trait.devil/glowing-eyes", "originalName": "Glowing Eyes", "originalDescription": "Your eyes are a solid, vibrant color that flares to show your excitement or rage. Whenever you take damage from a creature, you can use a triggered action to deal that creature psychic damage equal to 1d10 + your level."}, {"name": "Адское зрение", "cost": 1, "text": "ваши глаза позволяют вам видеть сквозь тьму, туман и другие типы покровов. Вы не получаете помеху на атаки против существ под покровом.", "id": "feature.trait.devil.hellsight", "originalId": "mcdm.heroes.v1/feature.trait.devil/hellsight", "originalName": "Hellsight", "originalDescription": "Your eyes let you see through darkness, fog, and other obscuring effects. You don't take a bane on strikes made against creatures with concealment."}, {"name": "Внушительные рога", "cost": 2, "text": "ваши лелеемые рога больше чем у обычного дьявола, и они являются затвердевшим олицетворением вашей силы воли. Вы успешно проходите Спасброски на бросках 5 или выше, вместо обычных 6 или выше.", "id": "feature.trait.devil.impressive-horns", "originalId": "mcdm.heroes.v1/feature.trait.devil/impressive-horns", "originalName": "Impressive Horns", "originalDescription": "Your cherished horns are larger than the average devil's, and a hardened representation of your force of will. Whenever you make a saving throw, you succeed on a roll of 5 or higher."}, {"name": "Цепкий хвост", "cost": 2, "text": "ваш цепкий хвост позволяет вам бросать вызов противникам со всех сторон. Вас нельзя окружить.", "id": "feature.trait.devil.prehensile-tail", "originalId": "mcdm.heroes.v1/feature.trait.devil/prehensile-tail", "originalName": "Prehensile Tail", "originalDescription": "Your prehensile tail allows you to challenge foes on all sides. You can't be flanked."}, {"name": "Крылья", "cost": 2, "text": "вы обладаете крыльями, достаточно мощными, чтобы поднять вас в воздух. Используя свои крылья для полета, вы можете находиться в воздухе количество раундов равное вашему показателю Мощи (минимум 1 раунд) до того как вы упадете. При использовании крыльев для полета на 3-м уровне или ниже у вас есть уязвимость к урону 5.", "id": "feature.trait.devil.wings", "originalId": "mcdm.heroes.v1/feature.trait.devil/wings", "originalName": "Wings", "originalDescription": "You possess wings powerful enough to take you airborne. While using your wings to fly, you can stay aloft for a number of rounds equal to your Might score (minimum 1 round) before you fall. While using your wings to fly at 3rd level or lower, you have damage weakness 5."}]}, {"name": "Драконий Рыцарь", "summary": "Драконоподобные гуманоиды являются относительно популярным происхождением среди разных настольных фентези миров. Объединяющей чертой среди всех миров является их близость к драконьей родословной и перенятия некоторых физиологических качеств этих могущественных созданий. Легенда такого происхождения варьируется от сеттинга к сеттингу. Пример официального сеттинга Draw Steel:", "budget": 3, "traits": [{"name": "Драконий страж", "cost": 1, "text": "всякий раз, когда вы или смежное существо получаете урон от удара, вы можете использовать триггер для защиты от удара. Вы уменьшаете любой урон от удара на количество, равное вашему уровню.", "id": "feature.trait.dragon-knight.draconian-guard", "originalId": "mcdm.heroes.v1/feature.trait.dragon-knight/draconian-guard", "originalName": "Draconian Guard", "originalDescription": "Whenever you or an adjacent creature takes damage from a strike, you can use a triggered action to guard against the blow. You reduce any damage from the strike by an amount equal to your level."}, {"name": "Драконья гордость", "cost": 2, "text": "у вас есть следующая знаковая способность.\n\n> **Драконья Гордость**\n> _\"Вы издаете могучий рев что колеблет ваших противников.\"_\n> \n> | **Область, Магия** |      **Основное действие** |\n> | -------------- | -------------------------: |\n> | **📏 Взрыв 1**   | **🎯 Каждый враг в области** |\n> \n> **Бросок силы + Мощь или Присутствие:**\n> - **≤11:** 2 урона\n> - **12-16:** 5 урона; толчок 1\n> - **17+:** 7 урона; толчок 2", "id": "feature.trait.dragon-knight.draconian-pride", "originalId": "mcdm.heroes.v1/feature.trait.dragon-knight/draconian-pride", "originalName": "Draconian Pride", "originalDescription": "You have the following signature ability."}, {"name": "Призматическая чешуя", "cost": 1, "text": "выберите один иммунитет к урону, предоставляемый вашей чертой Броня Дрейка. У вас всегда есть этот иммунитет в дополнение к иммунитету, предоставляемому Броней Дрейка.", "id": "feature.trait.dragon-knight.prismatic-scales", "originalId": "mcdm.heroes.v1/feature.trait.dragon-knight/prismatic-scales", "originalName": "Prismatic Scales", "originalDescription": "Select one damage immunity granted by your Wyrmplate trait. You always have this immunity, in addition to the immunity granted by Wyrmplate."}, {"name": "Помни свою клятву", "cost": 1, "text": "в качестве маневра, вы можете прочесть специальную клятву. До начала вашего следующего хода, всякий раз, когда вы проходите Спасбросок, вы преуспеваете при 4 или выше.", "id": "feature.trait.dragon-knight.remember-your-oath", "originalId": "mcdm.heroes.v1/feature.trait.dragon-knight/remember-your-oath", "originalName": "Remember Your Oath", "originalDescription": "As a maneuver, you can recite the following oath. Until the start of your next turn, whenever you make a saving throw, you succeed on a 4 or higher.\n\n*Even should the sun stop in the sky Even should the night last a thousand years I will stand forever I shall not yield Those who suffer and yearn for justice I am your sword and shield I will yield no ground I will speak no lies I will stand against all tyrants Until the last villain dies*"}, {"name": "Крылья", "cost": 2, "text": "вы обладаете крыльями, достаточно мощными, чтобы поднять вас в воздух. Используя свои крылья для полета, вы можете находиться в воздухе количество раундов равное вашему показателю Мощи (минимум 1 раунд) до того как вы упадете. При использовании крыльев для полета на 3-м уровне или ниже у вас есть уязвимость к урону 5.", "id": "feature.trait.dragon-knight.wings", "originalId": "mcdm.heroes.v1/feature.trait.dragon-knight/wings", "originalName": "Wings", "originalDescription": "You possess wings powerful enough to take you airborne. While using your wings to fly, you can stay aloft for a number of rounds equal to your Might score (minimum 1 round) before you fall. While using your wings to fly at 3rd level or lower, you have damage weakness 5."}, {"name": "Драконье дыхание", "cost": 2, "text": "у вас есть следующая знаковая способность.\n\n> **Драконье Дыхание**\n> _\"Яростный выдох энергии омывает ваших противников.\"_\n> \n> | **Область, Магия**            |        **Основное действие** |\n> | ------------------------- | ---------------------------: |\n> | **📏 Куб 3 в пределах 1** | **🎯 Каждый враг в области** |\n> \n> **Бросок силы + Мощь или Присутствие:**\n> - **≤11:** 2 урона\n> - **12-16:** 4 урона\n> - **17+:** 6 урона\n> \n> **Эффект:** Вы выбираете тип урона способности из кислоты, холода, порчи, огня, молнии или яда.", "id": "feature.trait.dragon-knight.dragon-breath", "originalId": "mcdm.heroes.v1/feature.trait.dragon-knight/dragon-breath", "originalName": "Dragon Breath", "originalDescription": "You have the following signature ability."}]}, {"name": "Дварф", "summary": "Традиционно, дварфы — низкорослые и коренастые гуманоиды, которые известны своей страстью к кузнечному делу, великой архитектурой и определенной своенравностью. Это варьируется от сеттинга к сеттингу, точно так же как и их происхождение. Порой они малым отличаются от типичных представителей людской расы в своем становлении, в других случаях это происхождение плотно ассоциировано со стихией, в которой они чувствуют себя как дома — бесконечно уходящая в недра земли порода камня. Пример происхождения дварфов в официальном варианте Draw Steel:", "budget": 3, "traits": [{"name": "Великая стойкость", "cost": 2, "text": "ваше крепкое телосложение не позволяет вам терять силу. Вы игнорируете эффект состояния ослабления.", "id": "feature.trait.dwarf.great-fortitude", "originalId": "mcdm.heroes.v1/feature.trait.dwarf/great-fortitude", "originalName": "Great Fortitude", "originalDescription": "Your hearty constitution prevents you from losing strength. You can't be made weakened."}, {"name": "Заземленность", "cost": 1, "text": "ваше тяжелое каменное тело и связь с землей затрудняют другим ваше перемещение. У вас есть +1 бонус к устойчивости.", "id": "feature.trait.dwarf.grounded", "originalId": "mcdm.heroes.v1/feature.trait.dwarf/grounded", "originalName": "Grounded", "originalDescription": "Your heavy stone body and connection to the earth make it difficult for others to move you. You have a +1 bonus to stability."}, {"name": "Искра с твоей кожи", "cost": 2, "text": "ваша каменная кожа обеспечивает вам мощной защитой. У вас есть +6 бонус к Выносливости, и этот бонус увеличивается на 6 на 4-м, 7-м и 10-м уровнях.", "id": "feature.trait.dwarf.spark-off-your-skin", "originalId": "mcdm.heroes.v1/feature.trait.dwarf/spark-off-your-skin", "originalName": "Spark Off Your Skin", "originalDescription": "Your stone skin affords you potent protection. You have a +6 bonus to Stamina, and that bonus increases by 6 at 4th, 7th, and 10th levels."}, {"name": "Стоять крепко", "cost": 1, "text": "ваше тело создано, чтобы выдерживать удары ваших врагов. Ваша характеристика Мощи считается на 1 выше для определения сопротивления Потенциалу, и вы получаете преимущество в тестах Мощи при сопротивлении эффектам окружающей среды или чертам и способностям существ.", "id": "feature.trait.dwarf.stand-tough", "originalId": "mcdm.heroes.v1/feature.trait.dwarf/stand-tough", "originalName": "Stand Tough", "originalDescription": "Your body is made to withstand the blows of your enemies. Your Might score is treated as 1 higher for the purpose of resisting potencies, and you gain an edge on Might tests when called for to resist environmental effects or a creature's traits or abilities."}, {"name": "Певец камней", "cost": 1, "text": "у вас есть магическая связь с землей. Когда вы тратите 1 непрерывный час на пение, вы можете изменить форму любого необработанного обычного камня в пределах 3 клеток. Вы не можете уничтожить этот камень, но можете переместить каждую клетку его куда угодно в пределах 3 клеток, складывая в сторону для прорывания ямы или выкладывая вверх для создания стены.", "id": "feature.trait.dwarf.stone-singer", "originalId": "mcdm.heroes.v1/feature.trait.dwarf/stone-singer", "originalName": "Stone Singer", "originalDescription": "You have a magic connection to the earth. When you spend 1 uninterrupted hour singing, you can reshape any unworked mundane stone within 3 squares. You can't destroy this stone, but you can move each square of it anywhere within 3 squares, piling it off to one side to dig a hole or building it up to create a wall."}]}], "careers": [{"name": "Агент", "benefits": "Вы работали шпионом для правительства или организации. При определении вашей карьеры подумайте над следующими вопросами:\n\n- На кого вы работали?\n- За кем вы шпионили?\n- Кто не должен знать вашу истинную личность и преданность, но знает?\n- Кого вы предали или оставили позади, чтобы выполнить работу?\n   \nВы получаете следующие преимущества карьеры:\n\n**Навыки**: Скрытность из группы интриги, плюс один навык из группы межличностных и один другой навык из группы интриги (*Быстрый Билд*: Маскировка, Обман, Скрытность.)\n\n**Языки**: Два языка\n\n**Перк**: Один перк группы интриги (*Быстрый Билд*: Забываемое лицо.)\n", "incidents": ["Отречение: выполняя опасное шпионское задание, все пошло наперекосяк. Хотя вы спасли свою жизнь, миссия провалилась публично из-за ложной информации, которую дало вам агентство. Они отказались от вас, и вы пустились в бега. Героическая работа позволит вам выжить и очистить свое имя.", "Безликий: ваша личность всегда была скрыта. Это был ваш способ защитить окружающих, потому что работа по шпионажу за влиятельными лицами несла опасности. Затем ваш мир рухнул, когда вражеский агент разоблачил вас, заставив потерять все в мгновение ока. Вместо того чтобы скрываться, вы стали публичным героем, защищая невинных во имя тех, кого потеряли.", "Вольный агент: было время в вашей жизни, когда вы продавали информацию тому, кто больше заплатит. Ваши действия не были санкционированы какой-либо организацией, и неизбежно привели к цепной реакции вреда, которая в итоге разрушила место, которое вы когда-то называли домом. Вы стали героем, чтобы искупить прошлое.", "Информированный: после многих лет выращивания богатого списка информаторов, один из них рискнул всем, чтобы разоблачить отвратительные планы влиятельных лиц. Вы пообещали защитить своего информатора, но ваше агентство оставило его висеть — буквально. Вы разорвали связи с работодателем и поклялись всегда сдерживать слово как герой.", "Шпионы и любовники: работая под прикрытием, вы влюбились в кого-то с другой стороны. Они обнаружили, что вы двойной агент, и хотя вы настаивали, что ваши чувства были настоящими, обман ранил слишком глубоко, чтобы возлюбленный мог простить. Они разоблачили вас, отвергли или умерли из-за близости к вам. Оставив шпионское дело, вы стали героем, которому нечего скрывать.", "Перебежчик: вы провели жизнь на службе своей страны или организации, которая поддерживала ваши ценности. Во время тайных операций вы обнаружили, что все, что вам говорили, было ложью. Столкнулись ли вы со своими начальниками или были разоблачены, вас лишили медалей за службу, прежде чем вы ушли становиться настоящим героем."]}, {"name": "Аристократ", "benefits": "Карьера? Кому нужна карьера, когда вы рождены в деньгах! Вам не нужно было работать благодаря родовому богатству. При определении вашей карьеры подумайте над следующими вопросами:\n\n- Как вы стали аристократом?\n- Чем вы занимались, чтобы заполнить свои дни?\n- Какие аристократы и люди, работавшие на вас, были вашими лучшими друзьями и злейшими врагами?\n- Какую сентиментальную реликвию из старого поместья вы носите с собой?\n   \nВы получаете следующие преимущества карьеры:\n\n**Навыки**: Один навык из группы межличностных и один навык из группы знаний (*Быстрый Билд*: Бравада, Общество.)\n\n**Языки**: Один язык\n\n**Известность**: +1\n\n**Богатство**: +1\n\nПерк: Один перк группы знаний (*Быстрый Билд*: Я читал об этом месте.)\n", "incidents": ["Кровавые деньги: когда вы достигли совершеннолетия, вы услышали неприятные слухи о семейном состоянии, прежде чем узнать, что богатство семьи досталось ценой чужих страданий. Пролили ли вы свет на эту тайну или нет, вы ушли, чтобы стать героем, лишившись дворянского титула.", "Очарованная жизнь: благодаря ли сверхъестественной силе или врожденному дару убеждения, вы смогли обманывать других аристократов. Вы делали это ради удовольствия. А когда вас разоблачили, вы потеряли свой статус. Отбыли ли вы срок или избежали наказания, вы решили реабилитироваться и стали героем.", "Наследство: опекуны, которые привили вам добродетели поступать правильно, были убиты в бессмысленном мелком ограблении. Хотя их богатство было завещано вам, это мало успокоило вину, которую вы испытывали из-за невозможности остановить смертельное преступление. Вы решили использовать свое богатство для финансирования жизни героя, публично или под псевдонимом.", "Привилегированное положение: жизнь за пределами поместья никогда вас не интересовала. У вас было все, что вы хотели. Поэтому стало неожиданностью, когда крестьяне пришли свергать вашу семью. Вы едва спаслись и впервые увидели мир. Это заставило вас стать героем для народа, борющимся против несправедливости.", "Королевский нищий: желая отдохнуть от дворянских обязанностей, вы нашли двойника, с которым можно поменяться местами. К сожалению, ваш двойник стал так хорошо вас изображать, что убедил всех окружающих, что вы были самозванцем. Теперь вы следуете героическим путем, свободным от пышности прежней жизни.", "Злая тайна: один родитель умер, когда вы были младенцем, а другой вступил в новый брак годы спустя. Затем этот родитель умер при подозрительных обстоятельствах. Их супруг изгнал вас, и вы были изгнаны (и, возможно, преследуемы). Восстав из трагедии, теперь вы стремитесь исправить несправедливости мира."]}, {"name": "Гладиатор", "benefits": "В прошлом вы развлекали массы эффектными проявлениями насилия на арене. При определении вашей карьеры подумайте над следующими вопросами:\n\n- Что привело вас к этой жизни жестоких развлечений?\n- Каково было ваше гладиаторское имя и образ?\n- Кто был вашим величайшим соперником?\n- Что случилось во время вашего самого знаменитого поединка?\n   \nВы получаете следующие преимущества карьеры:\n\n**Навыки**: Два навыка из группы исследования (*Быстрый Билд*: Гимнастика, Прыжки.)\n\n**Языки**: Один язык\n\n**Известность**: +2\n\n**Перк**: Один перк группы исследования (*Быстрый Билд*: Дружеская катапульта.)\n", "incidents": ["Предательство: местный криминальный авторитет предложил вам деньги за проигрыш в последнем бою, пообещав, что вы переживете испытание и получите долю от всех ставок, сделанных на поединок. Вы выполнили свою часть сделки — что сделало нож в спину после боя таким неожиданным. Вы очнулись в неглубокой могиле, едва живой и готовый вершить правосудие.", "Зритель: когда вы стояли победителем на песках арены, среди ликований раздался голос. \"Это насилие только для показа. Есть люди, которые нуждаются в вас — которые нуждаются в ваших навыках!\" Почему этот голос прозвучал так ясно и показался таким знакомым? Вы так и не увидели лица человека, произнесшего эти слова, но они вдохновили вас сбежать и начать героическую карьеру.", "Присоединился к арене: вы любили гладиаторские поединки, очарованные проявлениями бравады, особо не задумываясь о том, как бойцы оказались на ринге. Затем вашего друга ложно обвинили в преступлении и приговорили к участию в боях. Вы заняли его место и увидели жизнь тех кто был вынужден сражаться, вы пережили свое наказание и решили защищать несправедливо осужденных.", "Новые вызовы: вы заслужили каждый титул, который могли. Вы победили каждого противника, желающего встретиться с вами на арене. Ваша финальная битва с соперником закончилась вашей победой — и все равно вы остались неудовлетворены. Где-то есть другие, более великие враги. И вы намерены их найти.", "Сострадание наследника: вы родились дворянином, но коварная и жаждущая власти природа вашей семьи заставила вас искать собственное состояние на арене. Вы видели, что бойцы, оказавшиеся там по обстоятельствам, а не по выбору, страдали. Вы отдали все, что могли из семейных денег, менее удачливым людям, а затем отправились изменить этот жестокий мир к лучшему.", "Дом воинов: приют, в котором вы выросли, тайно поставлял гладиаторов на арену. Вынужденный сражаться против многих друзей детства, будучи взрослым, вы поклялись демонтировать арену и освободить других жертв. Вы стали освободителем, посвятившим себя прекращению угнетения других до своего последнего вздоха."]}], "cultures": {"environment": [{"name": "Кочевое", "text": "Кочевая культура путешествует с места на место, чтобы выжить. Представители кочевой культуры могут следовать за миграциями животных или погодой, путешествовать, чтобы продавать свои товары или услуги, или просто наслаждаться беспокойным образом жизни, полным новых впечатлений и народов. Те, кто растет в кочевых культурах, учатся ориентироваться в дикой местности и тесно сотрудничать с другими, чтобы выжить.\n\nВарианты навыков: один навык из группы исследования или межличностных навыков. (*Быстрый Билд*: Навигация.)", "articleId": "0502", "originalId": "mcdm.heroes.v1/culture/nomadic", "originalName": "Nomadic", "originalDescription": "A nomadic culture travels from place to place to survive. Members of a nomadic culture might follow animal migrations or the weather, travel to sell their wares or services, or simply enjoy a restless lifestyle full of new experiences and peoples. Those who grow up in nomadic cultures learn to navigate the wilderness and work closely with others to survive.\n\n**Skill Options:** One skill from the exploration or interpersonal skill groups. (*Quick Build:* Navigate.)", "id": "culture.nomadic"}, {"name": "Сельское", "text": "Сельская культура находится в городе, деревне или меньшем поселенном анклаве. Люди, живущие в таких местах, часто обрабатывают землю, торгуют товарами или услугами с проходящими путешественниками, добывают рыбу из моря или добывают металлы и драгоценные камни из земли.\nЖивя среди небольшого населения, большинство людей в сельском сообществе изучают ремесло и получают частички необходимых знаний, чтобы помочь своему сообществу выжить. Например, когда в сельской культуре есть только один кузнец, важно иметь ученика, уже изучающего работу у наковальни задолго до того, как этот кузнец начнет стареть. Если единственный священник в городе подхватит простуду, люди хотят, чтобы аколит был готов надеть причудливые одеяния, если случится худшее.\n\nВарианты навыков: один навык из группы ремесла или знаний. (*Быстрый Билд*: Природа.)", "articleId": "0502", "originalId": "mcdm.heroes.v1/culture/rural", "originalName": "Rural", "originalDescription": "A rural culture is one located in a town, village, or smaller settled enclave. People dwelling in such places often cultivate the land, trade goods or services with travelers passing through, harvest fish from the sea, or mine metals and gems from the earth.\n\nLiving among a small population, most folks in a rural community learn a trade and are handed down bits of essential knowledge to help their community survive. For example, when a rural culture has only one blacksmith, it's important to have an apprentice already learning at the anvil well before that smith starts to get old. If the only priest in town\n\ngets the sniffles, folks want an acolyte ready to wear the fancy robes should the worst occur.\n\n**Skill Options:** One skill from the crafting or lore skill groups. (*Quick Build:* Nature.)", "id": "culture.rural"}, {"name": "Уединенное", "text": "Уединенная культура базируется в одном относительно тесном сооружении — здании, пещере и так далее — и взаимодействует с другими культурами только редко. Такие места часто являются зданиями или комплексами, такими как монастыри, замки или тюрьмы. Люди в уединенной культуре имеют мало причин или вообще не имеют причин покидать свой дом или взаимодействовать с другими культурами снаружи.\nКогда люди живут вместе в тесных помещениях, они обычно учатся ладить друг с другом. Они часто проводят много времени в изучении или самоанализе, так как в уединении больше особо нечего делать.\n\nВарианты навыков: один навык из группы межличностных или знаний. (*Быстрый Билд*: Чтение личности.)", "articleId": "0502", "originalId": "mcdm.heroes.v1/culture/secluded", "originalName": "Secluded", "originalDescription": "A secluded culture is based in one relatively close-quarters structure—a building, a cavern, and so forth—and interacts with other cultures only rarely. Such places are often buildings or complexes such as monasteries, castles, or prisons. Folk in a secluded culture have little or no reason to leave their home or interact with other cultures on the outside, but might have an awareness of those cultures and of events happening beyond their enclave.\n\nWhen people live together in close quarters, they typically learn to get along. They often spend much time in study or introspection, as there is not much else to do in seclusion.\n\n**Skill Options:** One skill from the interpersonal or lore skill groups. (*Quick Build:* Read Person.)", "id": "culture.secluded"}, {"name": "Городское", "text": "Городская культура всегда сосредоточена в городе. Такая культура может возникнуть в стенах столицы, массивного мегаполиса с разнообразным населением; в сети пещер, которые содержат подземный город; или в любом другом месте, где большое население живет относительно близко друг к другу. Люди городских культур часто учатся эффективно вводить других в заблуждение, чтобы ориентироваться в толпах и политических махинациях, которые могут прийти с городской жизнью.\n\nВарианты навыков: один навык из группы межличностных или интриги. (*Быстрый Билд*: Внимательность.)", "articleId": "0502", "originalId": "mcdm.heroes.v1/culture/urban", "originalName": "Urban", "originalDescription": "An urban culture is always centered in a city. Such a culture might arise within the walls of Capital, a massive metropolis with a cosmopolitan population; within a network of caverns that hold an underground city; or in any other place where a large population lives relatively close together. The people of urban cultures often learn to effectively misdirect others in order to navigate the crowds and the political machinations that can come with city life.\n\n**Skill Options:** One skill from the interpersonal or intrigue skill groups. (*Quick Build:* Alertness.)", "id": "culture.urban"}, {"name": "Дикая местность", "text": "Культура дикой местности не пытается приручить местность, в которой живут ее люди, будь то пустыня, лес, болото, тундра, океан или более экзотические места. Вместо этого люди такой культуры процветают среди природы, получая пропитание и укрытие от земли. Культурой дикой местности может быть круг друидов, защищающих отдаленный лес, банда разбойников, прячущаяся в пустынных пещерах, или лагерь орков-наемников, которые называют непроходимые горы домом. Люди в культуре дикой местности учатся использовать землю для всего, что им нужно для жизни, обычно изготавливая свои собственные инструменты, одежду и многое другое.\n\nВарианты навыков: один навык из группы ремесла или исследования. (*Быстрый Билд*: Стойкость.)", "articleId": "0502", "originalId": "mcdm.heroes.v1/culture/wilderness", "originalName": "Wilderness", "originalDescription": "A wilderness culture doesn't try to tame the terrain in which its people live, whether desert, forest, swamp, tundra, ocean, or more exotic climes. Instead, the folk of such a culture thrive amid nature, taking their sustenance and shelter from the land. A wilderness culture might be a circle of druids protecting a remote wode, a band of brigands hiding out in desert caves, or a camp of orc mercenaries who call the trackless mountains home. People in a wilderness culture learn how to use the land for all they need to live, typically crafting their own tools, clothing, and more.\n\n**Skill Options:** One skill from the crafting or exploration skill groups. (*Quick Build:* Endurance.)", "id": "culture.wilderness"}], "organization": [{"name": "Бюрократическая", "text": "Бюрократические культуры погружены в официальное руководство и формально записанные законы. Представители таких культур часто ранжированы по власти в соответствии с этими законами, с небольшой группой людей, обладающих властью править согласно праву рождения, народному голосованию или какому-то другому официальному и измеримому стандарту. Многие бюрократические сообщества имеют одного человека на вершине, хотя другие могут управляться советом. Торговая гильдия с гильдмастером, казначеем, секретарем и уставом правил и положений для членства; феодальный лорд, который правит группой рыцарей, которые в свою очередь правят крестьянами, работающими на земле; и милитаристское общество с рангами и правилами, которым его люди должны подчиняться, — все это примеры бюрократических культур.\nТе, кто процветает в бюрократических культурах, не просто следуют правилам. Они знают, как использовать эти правила в своих интересах, либо изгибая, изменяя или переосмысляя политику для продвижения своих собственных интересов. Заискивание перед теми, кто создает законы, часто является ключом к этому подходу. Другие в бюрократической культуре могут специализироваться на работе вне строгих правил, которые управляют культурой, не попадаясь.\n\nВарианты навыков: Один навык из группы межличностных или интриги. (*Быстрый Билд*: Убеждение.)\n\n> ##### Но я очень хочу внимательность\n> Если созданная вами культура не дает навык, который вы хотите, посоветуйтесь с вашим Ведущим о модификации того, что предлагают аспекты культуры. Например, вы легко можете обосновать, что культура с аспектом дворянского воспитания должна дать персонажу доступ к навыку Внимательность, учитывая, что жизнь среди тех, кто жаждет вашей власти, означает всегда быть осведомленным о своем окружении.", "articleId": "0503", "originalId": "mcdm.heroes.v1/culture/bureaucratic", "originalName": "Bureaucratic", "originalDescription": "Bureaucratic cultures are steeped in official leadership and formally recorded laws. Members of such a culture are often ranked in power according to those laws, with a small group of people holding the power to rule according to birthright, popular vote, or some other official and measurable standard. Many bureaucratic communities\n\nhave one person at the top, though others might be ruled by a council. A trade guild with a guildmaster, treasurer, secretary, and a charter of rules and regulations for membership; a feudal lord who rules over a group of knights who in turn rule over peasants working the land; and a militaristic society with ranks and rules that its people must abide are all examples of bureaucratic cultures.\n\nThose who thrive in bureaucratic cultures don't simply follow the rules. They know how to use those rules to their advantage, either bending, changing, or reinterpreting policy to advance their own interests. Schmoozing with those who make the laws is often key to this approach. Others in a bureaucratic culture might specialize in operating outside the strict regulations that govern the culture without getting caught.\n\n**Skill Options:** One skill from the interpersonal or intrigue skill groups. (*Quick Build:* Persuade.)", "id": "culture.bureaucratic"}, {"name": "Общинная", "text": "Общинная культура — это место, где все представители культуры считаются равными. Сообщество работает вместе, чтобы принимать важные решения, которые затрагивают большинство культуры. Хотя они избирают лидеров для выполнения этих решений и организации своих усилий, каждый человек имеет относительно равный голос в том, как работает культура, и каждый вносит свой вклад, чтобы помочь своему народу выжить и процветать. Люди часто разделяют бремя управления, физического труда, ухода за детьми и других обязанностей. Коллектив фермеров, которые работают вместе, чтобы обрабатывать и защищать свою землю без дворянина, город пиратов, где каждый человек может делать, что хочет — все это общинные культуры.\nМногие общинные культуры работают за пределами населенных земель, придерживаясь дикой местности, конкретного района в большем поселении, городских канализаций, забытых руин или других изолированных мест. Поскольку даже когда такие культуры безвредны, их представители знают, что посторонние могут попытаться навязать им правила, если они живут в том же месте. Таким образом, многие люди в таких культурах стремятся к самообеспечению, чтобы избежать опасности.\n\nВарианты навыков: Один навык из группы ремесла или исследования. (*Быстрый Билд*: Прыжки.)", "articleId": "0503", "originalId": "mcdm.heroes.v1/culture/communal", "originalName": "Communal", "originalDescription": "A communal culture is a place where all members of the culture are considered equal. The community works together to make important decisions that affect the majority of the culture. While they elect leaders to carry out these decisions and organize their efforts, each person has a relatively equal say in how the culture operates, and everyone contributes to help their people survive and thrive. Individuals often share the burdens of governing, physical labor, childcare, and other duties. A collective of farmers who work together to cultivate and protect their land without a noble, a city of pirates where each person can do as they wish, and a traveling theatrical troupe whose members vote on every artistic and administrative decision are all communal cultures.\n\nMany communal cultures operate outside settled lands, sticking to the wilds, a specific district in a larger settlement, city sewers, forgotten ruins, or other isolated places. For even when such cultures are harmless, their members know that outsiders might try to impose rules upon them if they live in the same place. As such, many folks in communal cultures focus on fending for themselves while avoiding the danger that other groups can represent.\n\n**Skill Options:** One skill from the crafting or exploration skill groups. (*Quick Build:* Jump.)", "id": "culture.communal"}], "upbringing": [{"name": "Академическое", "text": "Вашего героя воспитали люди, которые собирают, изучают и делятся книгами и другими записями. Некоторые академики сосредотачиваются на одной области изучения, такой как колледж для волшебников, посвященный изучению магии, или церковь, которая учит слову одного божества. \nВарианты навыков: Один навык из группы знаний. (*Быстрый Билд*: История.)", "articleId": "0504", "originalId": "mcdm.heroes.v1/culture/academic", "originalName": "Academic", "originalDescription": "Your hero was raised by people who collect, study, and share books and other records. Some academics focus on one area of study, such as a college for wizards dedicated to the study of magic, or a church that teaches the word of one deity. People in an academic culture learn how to wield the power that is knowledge.\n\n**Skill Options:** One skill from the lore skill group. (*Quick Build:* History.)", "id": "culture.academic"}, {"name": "Творческое", "text": "Герой с творческим воспитанием был воспитан среди людей, которые создают искусство или другие работы, достаточно ценные для торговли. Творческая культура может производить изобразительное искусство, такое как танец, музыка или скульптура, или более практичные товары, как оружия, катализаторы или здания.\nВарианты навыков: Музыка или Выступление, или один навык из группы ремесла. (*Быстрый Билд*: Выступление.)", "articleId": "0504", "originalId": "mcdm.heroes.v1/culture/creative", "originalName": "Creative", "originalDescription": "A hero with a creative upbringing was raised among folk who create art or other works valuable enough to trade. A creative culture might produce fine art such as dance, music, or sculpture, or more practical wares such as wagons, weapons, tools, or buildings. People in such cultures learn the value of quality crafting and attention to detail.\n\n**Skill Options:** The Music or Perform skill (from the interpersonal skill group), or one skill from the crafting group. (*Quick Build:* Perform.)", "id": "culture.creative"}, {"name": "Трудовое", "text": "Ваш герой повзрослел в культуре, где люди трудились, чтобы заработать на жизнь. Они могли быть земледельцами, обычно выращивающими урожай или скот на ферме. Они могли добывать природные ресурсы, или они могли преуспеть в ручном труде, связанном с поселением и торговлей, таком как строительство, перевозка, погрузка груза и так далее.\nВарианты навыков: Кузнечное дело,  Обращение с животными, или навык из группы исследования. (*Быстрый Билд*: Лифтинг.)", "articleId": "0504", "originalId": "mcdm.heroes.v1/culture/labor", "originalName": "Labor", "originalDescription": "Your hero came of age in a culture where people labored for a living. They might have been cultivators, typically raising crops or livestock on a farm. They might have harvested natural resources, whether by hunting, trapping, logging, or mining. Or they might have excelled at manual labor tied to settlement and trade, such as construction, carting, loading cargo, and so forth. People with a labor upbringing know the value of hard work.\n\n**Skill Options:** The Blacksmithing skill (from the crafting skill group), the Handle Animals skill (from the interpersonal group), or a skill from the exploration group. (*Quick Build:* Lift.)", "id": "culture.labor"}, {"name": "Беззаконное", "text": "Ваш герой вырос среди людей, которые выполняли деятельность, которую другие люди — будь то внутри или за пределами их культуры — считали незаконной. Банда пиратов, гильдия ассасинов или организация шпионов — все совершают незаконные действия за деньги. А при тирании люди, занимающиеся восстанием, часто считаются беззаконными в своих действиях и деятельности.\nВарианты навыков: Один навык из группы интриги. (*Быстрый Билд*: Скрытность.)", "articleId": "0504", "originalId": "mcdm.heroes.v1/culture/lawless", "originalName": "Lawless", "originalDescription": "Your hero grew up among folk who performed activities that other people—whether within or outside their culture—considered unlawful. A band of pirates, a guild of assassins, or an organization of spies all commit unlawful acts for money. And under tyranny, people engaged in rebellion are often considered lawless in their actions and activities. People brought up in a lawless culture typically don't mind breaking the rules when it suits them—and are good at making sure no one finds out they did.\n\n**Skill Options:** One skill from the intrigue skill group. (*Quick Build:* Sneak.)", "id": "culture.lawless"}, {"name": "Воинское", "text": "Герой с воинским воспитанием был воспитан воинами. Это могли быть солдаты установленной армии, банда наемников, гильдия истребителей монстров-искателей приключений или любые другие люди, чья жизнь вращается вокруг боя.\nВарианты навыков: Кузнечное дело или Оперение из группы ремесла; Скалолазание, Стойкость или Езда из группы исследования; Запугивание из группы межличностных; Внимательность или Выслеживание из группы интриги; или Монстры или Стратегия из группы знаний. (*Быстрый Билд*: Запугивание.)", "articleId": "0504", "originalId": "mcdm.heroes.v1/culture/martial", "originalName": "Martial", "originalDescription": "A hero with a martial upbringing was raised by warriors. These might have been the soldiers of an established army, a band of mercenaries, a guild of monster-slaying adventurers, or any other folk whose lives revolve around combat. Heroes with a martial upbringing are always ready for a fight—and they know how to finish that fight.\n\n**Skill Options:** One of the following: Blacksmithing or Fletching from the crafting skill group; Climb, Endurance, or Ride from the exploration group; Intimidate from the interpersonal group; Alertness or Track from the intrigue group; or Monsters or Strategy from the lore skill group (*Quick Build:* Intimidate.)", "id": "culture.martial"}, {"name": "Дворянское", "text": "Ваш герой вырос среди лидеров, которые правят другими и играют в политические игры, чтобы сохранить власть. Многие семьи являются дворянами по праву рождения, но некоторые культуры имеют дворянские титулы, заработанные поступками или популярностью. Каков бы ни был случай, герои с такой предысторией понимают силу власти.\nВарианты навыков: Один навык из группы межличностных. (*Быстрый Билд*: Лидерство.)", "articleId": "0504", "originalId": "mcdm.heroes.v1/culture/noble", "originalName": "Noble", "originalDescription": "Your hero grew up among leaders who rule over others and play the games of politics to maintain power. Many families are nobles by birthright, but some cultures have noble titles earned through deeds or popularity. Whatever the case, heroes with this background understand why the whispered words in the right ear can sometimes be more powerful than any army.\n\n**Skill Options:** One skill from the interpersonal skill group. (*Quick Build:* Lead.)\n\n> **But I Really Want Alertness**\n>\n> If the culture you create doesn't grant a skill that you want, check with your Director about modifying what the culture's aspects offer. For instance, you can easily make the case that a culture with the noble upbringing aspect should give a character access to the Alertness skill, given that living among those who covet your power means always being aware of your surroundings.", "id": "culture.noble"}]}, "kits": [{"name": "Беглый Огонь", "summary": "Комплект Беглый огонь предназначен для лучников, которые хотят нанести максимальный урон, выпустив как можно больше стрел в ближайших врагов. В этом комплекте ваша боевая техника фокусируется на обстреле врагов до того, как они смогут подобраться достаточно близко для контратаки.", "equipment": "Вы носите легкие доспехи и владеете луком.", "bonuses": [{"label": "выносливости", "value": "+3 за эшелон"}, {"label": "скорости", "value": "+1"}, {"label": "урону (Дальний)", "value": "+2/+2/+2"}, {"label": "расстоянию (Дальний)", "value": "+7"}, {"label": "отходу", "value": "+1"}], "signatureAbility": "Двойной Выстрел"}, {"name": "Боевой Разум", "summary": "Кто сказал, что легкобронированных героев легко сдвинуть с места? Вам просто нужно применить немного псионики! Комплект Боевой разум использует силу вашего разума, чтобы сделать вас более устойчивым — и чтобы вам было легче отталкивать своих врагов.", "equipment": "Вы носите легкие доспехи и владеете средним оружием.", "bonuses": [{"label": "выносливости", "value": "+3 за эшелон"}, {"label": "скорости", "value": "+2"}, {"label": "устойчивости", "value": "+1"}, {"label": "урону (Ближний)", "value": "+2/+2/+2"}], "signatureAbility": "Отвязывание"}, {"name": "Буревестник", "summary": "Первозданный аспект буревестника позволяет вам направлять свою свирепость в форму животного и дает вам знание одного комплекта буревестника по вашему выбору. Вы можете освоить дополнительные комплекты буревестника в процессе игры, меняя их во время отдыха, как и любой другой комплект (смотрите Комплекты).\n#### Особенности комплекта\nВсе комплекты буревестника имеют следующие общие особенности.", "equipment": "Вы не носите броню и владеете только безоружными ударами — которые становятся разрушительным природным оружием по мере роста вашей свирепости.", "bonuses": [], "signatureAbility": "Сносящая Атака"}, {"name": "Вихрь", "summary": "Комплект Вихрь эффективно использует хлысты, предоставляя вам мобильность, урон и досягаемость. Если вы хотите быть быстро движущимся воином, который хлещет врагов цепью или хлыстом, то это комплект для вас.", "equipment": "Вы не носите доспехов и владеете хлыстом.", "bonuses": [{"label": "скорости", "value": "+3"}, {"label": "урону (Ближний)", "value": "+1/+1/+1"}, {"label": "расстоянию (Ближний)", "value": "+1"}, {"label": "отходу", "value": "+1"}], "signatureAbility": "Продолжение Моей Руки"}], "abilities": [{"name": "Волна Смерти", "flavor": "Научите их как безрассудно выстраиваться перед вами.", "effect": "Вы перемещаетесь на расстояние вплоть до вашей скорости по прямой линии, и клетки врагов не являются для вас труднопроходимой местностью во время этого движения. Вы можете закончить это движение в пространстве существа и переместить его на соседнюю свободную клетку. Вы делаете один бросок силы, который нацелен на каждого врага, через чье пространство вы проходите.\n\nПоследняя цель, которой вы наносите урон, получает дополнительный урон, равный показателю вашей Мощи, за каждую атаку по возможности, которую вы провоцируете во время вашего движения.", "className": "Неистовый"}, {"name": "Назад!", "flavor": "Вы рубите вокруг себя своим могучим оружием, отбрасывая врагов назад.", "effect": "", "className": "Неистовый"}, {"name": "С Дороги!", "flavor": "Ваши враги расчистят вам путь — хотят они того или нет.", "effect": "Когда вы совершаете швыряние цели, вы можете переместиться на любую клетку, которую она покидает. Если вы получаете урон от атаки по возможности при перемещении таким образом, цель получает такой же урон.", "className": "Неистовый"}, {"name": "Твои внутренности Теперь Твои Наружности!", "flavor": "Им трудно сражаться, когда они заняты удерживанием своих потрохов.", "effect": "Находясь в состоянии кровотечения таким образом, цель получает урон, равный показателю вашей Мощи, в конце каждого вашего хода.", "className": "Неистовый"}, {"name": "Боевой Клич", "flavor": "Вы выкрикиваете фразу, которая воодушевляет вашу команду.", "effect": "", "className": "Тактик"}, {"name": "Вдохновляющий Удар", "flavor": "Ваша атака дарит союзнику надежду.", "effect": "", "className": "Тактик"}, {"name": "Контузящий Удар", "flavor": "Ваш точный удар оставляет врага исключительно ошеломленным.", "effect": "", "className": "Тактик"}, {"name": "Отряд! Вперед!", "flavor": "По вашей команде вы и ваши союзники оттесняете вражескую линию.", "effect": "Каждая цель может переместиться вплоть до своей скорости.", "className": "Тактик"}, {"name": "Войти и Выйти", "flavor": "Двигайся неожиданно, бей быстро и исчезай!", "effect": "Вы можете сместиться вплоть до вашей скорости, разделив это движение до или после вашего удара по желанию.", "className": "Тень"}, {"name": "Две Глотки Разом", "flavor": "Выгодная сделка.", "effect": "", "className": "Тень"}, {"name": "Дезориентирующий Удар", "flavor": "Ваша атака оставляет их пошатывающимися, даря вам больше движения.", "effect": "Вы можете сместиться на любую клетку, которую покидает цель, когда вы совершаете ее швыряние.", "className": "Тень"}, {"name": "Потрошение", "flavor": "Вы оставляете своего врага истекать кровью после разрушительной атаки.", "effect": "", "className": "Тень"}]};
const root=document.getElementById('hero-flow');
const names=['Происхождение','Предыстория','Класс','Снаряжение','Способности','Личность','Проверка'];
let stage=2,sub=0,level=1,browsing={},finished=false;
let chosen={ancestry:DATA.ancestries[0].name,career:DATA.careers[0].name,culture:'Сельское',name:'',details:''};
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
function button(text,fn,cls=''){const b=el('button',cls,text);b.type='button';b.onclick=fn;return b;}
function clean(s){return(s||'').replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/^#+\s*/gm,'').replace(/[*_`]/g,'').trim();}
const cls=()=>DATA.classes.find(c=>c.name===chosen.className)||DATA.classes[0];
function steps(){return [
 [{key:'ancestry',title:'Откуда вы родом?',hint:'Познакомьтесь с происхождениями и выберите одно.',options:DATA.ancestries},{key:'trait',title:'Выберите черты происхождения',hint:'Знаковая черта добавится автоматически. Здесь показан пример одного выбора.',options:(DATA.ancestries.find(a=>a.name===chosen.ancestry)||DATA.ancestries[0]).traits.map(t=>({...t,summary:t.text,note:t.cost+' очк.'}))}],
 [{key:'culture',title:'В какой культуре вы выросли?',hint:'Окружение → организация → воспитание → навыки. В эскизе показан выбор окружения.',options:DATA.cultures.environment.map(o=>({...o,summary:o.text}))},{key:'career',title:'Кем вы были до приключений?',hint:'После карьеры — её навыки, перк и побуждающий инцидент.',options:DATA.careers.map(c=>({...c,summary:c.benefits}))},{key:'incident',title:'Что сделало вас героем?',hint:'Побуждающий инцидент выбранной карьеры.',options:(DATA.careers.find(c=>c.name===chosen.career)||DATA.careers[0]).incidents.map((s)=>({name:s.split(':')[0],summary:s.slice(s.indexOf(':')+1)}))}],
 [{key:'className',title:'Как вы будете сражаться?',hint:'Изучайте класс на любом уровне. Выбор применится только после подтверждения.',options:DATA.classes},{key:'subclass',title:'Выберите путь внутри класса',hint:'Каждое решение — отдельный шаг. Описания открываются здесь же.',options:cls().subclasses.map(s=>({...s,summary:s.text}))},{key:'array',title:'Распределите характеристики',hint:'Затем — навыки и обязательные особенности класса. В эскизе показываем выбор набора.',options:[{name:'2, −1, −1',summary:'Набор для трёх оставшихся характеристик.'},{name:'1, 1, −1',summary:'Набор для трёх оставшихся характеристик.'},{name:'1, 0, 0',summary:'Набор для трёх оставшихся характеристик.'}]}],
 [{key:'kit',title:'Выберите комплект',hint:'Комплект даёт снаряжение, бонусы и способность. Дополнительные выборы зависят от класса.',options:DATA.kits}],
 [{key:'ability',title:'Выберите способность за 3 ресурса',hint:'Группы идут последовательно: знаковые → за 3 ресурса → за 5 ресурсов. Здесь — пример выбора из одной группы.',options:DATA.abilities.filter(a=>a.className===cls().name).map(a=>({...a,summary:a.flavor+'\n\n'+a.effect}))}],
 [{key:'personality',title:'Теперь герой — ваш',hint:'Имя, внешность и связи. Остальные детали можно дописать позже.'}],
 [{key:'review',title:'Проверьте своего героя',hint:'Все принятые решения собраны вместе. Любое можно изменить.'}]
 ][stage];}
function move(s,i=0){stage=s;sub=i;level=1;finished=false;render();}
function detailText(parent,text){const p=el('p','rule-copy',clean(text));parent.append(p);}
function render(){
const nav=root.querySelector('nav');nav.replaceChildren();names.forEach((n,i)=>{const b=button('',()=>move(i));b.append(el('b','',String(i+1)),document.createTextNode(n));if(i===stage)b.setAttribute('aria-current','step');nav.append(b);});
root.querySelector('#hero-summary').textContent=(chosen.name||'Ваш герой')+' · '+[chosen.ancestry,chosen.className||'класс ещё не выбран'].join(' · ');
root.querySelector('#hero-values').textContent=[chosen.culture,chosen.career,chosen.subclass,chosen.kit].filter(Boolean).join(' · ')||'Решения будут появляться здесь.';
const main=root.querySelector('main');main.replaceChildren();const footer=root.querySelector('footer');footer.replaceChildren();
if(finished){main.append(el('h1','','Герой готов к приключению'),el('p','','Так заканчивается создание: открывается лист с выбранными особенностями, снаряжением и способностями.'),el('p','quiet','Это финал эскиза. Данные в приложении не изменены.'));main.append(button('Вернуться к проверке',()=>{finished=false;render();}));return;}
const items=steps();sub=Math.min(sub,items.length-1);const current=items[sub];
main.append(el('span','quiet small','Этап '+(stage+1)+' из 7 · '+names[stage]),el('h1','',current.title),el('p','quiet',current.hint));
if(items.length>1){const trail=el('div','substeps');items.forEach((s,i)=>{if(i)trail.append(document.createTextNode('  →  '));trail.append(el(i===sub?'strong':'span','',s.title.replace('?','')));});main.append(trail);}
if(current.options){
let opts=current.options;let viewed=opts.find(o=>o.name===browsing[current.key])||opts.find(o=>o.name===chosen[current.key])||opts[0];
const layout=el('div','layout'),list=el('div','options'),reader=el('article','reader');layout.append(list,reader);main.append(layout);
opts.forEach(o=>{const b=button(o.name,()=>{browsing[current.key]=o.name;level=1;render();});b.setAttribute('aria-pressed',String(o.name===viewed?.name));if(chosen[current.key]===o.name)b.append(el('small','','✓ Выбрано для героя'));else if(o.note)b.append(el('small','',o.note));list.append(b);});
if(viewed){reader.append(el('span','quiet small','Справочник · '+names[stage]),el('h2','',viewed.name));
detailText(reader,(viewed.summary||'').split('\n\n')[0]);
if(current.key==='className'){
reader.append(el('h3','','Развитие класса'));const tabs=el('div','levels');tabs.setAttribute('role','group');tabs.setAttribute('aria-label','Уровень класса');
for(let n=1;n<=10;n++){const b=button(String(n),()=>{level=n;render();});b.setAttribute('aria-pressed',String(n===level));b.setAttribute('aria-label','Уровень '+n);tabs.append(b);}reader.append(tabs);
reader.append(el('div','note',level===1?'1-й уровень · особенности при создании героя':level+'-й уровень · доступно для изучения. Герой начнёт с 1-го уровня.'));
const features=viewed.levels[level-1]||[];
features.slice(0,3).forEach(f=>{const d=el('details','rules');d.append(el('summary','',f.name));detailText(d,f.text);reader.append(d);});
}else{const more=el('details','read-more');more.append(el('summary','','Описание и правила'));detailText(more,viewed.summary||viewed.text);if(viewed.equipment)detailText(more,viewed.equipment+'\n'+viewed.bonuses.map(b=>b.label+' '+b.value).join(' · ')+'\nЗнаковая способность: '+viewed.signatureAbility);reader.append(more);}
const apply=button(chosen[current.key]===viewed.name?'✓ Выбрано для героя':'Выбрать: '+viewed.name,()=>{if(current.key==='className'&&chosen.className!==viewed.name){delete chosen.subclass;delete chosen.array;delete chosen.ability;}if(current.key==='ancestry'&&chosen.ancestry!==viewed.name)delete chosen.trait;if(current.key==='career'&&chosen.career!==viewed.name)delete chosen.incident;chosen[current.key]=viewed.name;render();},chosen[current.key]===viewed.name?'':'primary');apply.disabled=chosen[current.key]===viewed.name;const applyRow=el('div','read-more');applyRow.append(apply);reader.append(applyRow);
if(current.key==='className'&&chosen.className&&chosen.className!==viewed.name)reader.append(el('p','quiet small','При смене класса потребуется заново выбрать подкласс, характеристики и способности.'));
}
}else if(current.key==='personality'){
[['name','Имя героя','Например, Арина'],['details','Внешность, характер и связи','Что стоит знать о вашем герое?']].forEach(([key,label,placeholder])=>{const l=el('label','',label);const input=el(key==='name'?'input':'textarea');input.value=chosen[key]||'';input.placeholder=placeholder;input.oninput=()=>{chosen[key]=input.value;root.querySelector('#next').disabled=!chosen.name.trim();};l.append(input);main.append(l);});
}else{
const fields=[['Происхождение','ancestry',0],['Черта','trait',0,1],['Окружение','culture',1],['Карьера','career',1,1],['Инцидент','incident',1,2],['Класс','className',2],['Подкласс','subclass',2,1],['Набор характеристик','array',2,2],['Комплект','kit',3],['Способность','ability',4],['Имя','name',5]];
fields.forEach(([label,key,s,i])=>{const row=el('div','review-row'),text=el('div');text.append(el('span','quiet small',label),el('strong','',chosen[key]||'Ещё не выбрано'));row.append(text,button(chosen[key]?'Изменить':'Выбрать',()=>move(s,i||0)));main.append(row);});
main.append(el('p','quiet small','В полной версии здесь также будут навыки, все способности и рассчитанные параметры листа.'));
}
const status=el('span','footer-copy quiet small',current.options?(chosen[current.key]?'Выбрано: '+chosen[current.key]:'Просмотр не меняет героя. Подтвердите выбор.'):'Решения сохраняются при переходах внутри эскиза.');status.setAttribute('aria-live','polite');footer.append(status);
const actions=el('div','row');if(stage>0||sub>0)actions.append(button('← Назад',()=>{if(sub>0){sub--;render();}else{stage--;sub=steps().length-1;render();}}));
const next=button(stage===6?'Завершить пример':'Далее →',()=>{if(stage===6){finished=true;render();}else if(sub<items.length-1){sub++;level=1;render();}else move(stage+1);},'primary');next.id='next';next.disabled=current.options?!chosen[current.key]:current.key==='personality'?!chosen.name.trim():false;actions.append(next);footer.append(actions);
}
render();
</script></html>
