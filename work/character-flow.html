ro-flow .reader{background:var(--paper);padding:20px;border:1px solid var(--line);border-radius:var(--radius);min-width:0}#hero-flow .levels{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}#hero-flow .levels button{min-width:31px;padding:6px 8px;text-align:center}#hero-flow .note{border-left:2px solid var(--tone);padding:2px 0 2px 12px;margin:15px 0;color:var(--quiet)}#hero-flow .rules{border-top:1px solid var(--line);padding:10px 0}#hero-flow .rules summary{cursor:pointer}#hero-flow .rule-copy{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}#hero-flow .read-more{margin-top:12px}#hero-flow .substeps{margin-top:14px;font-size:12px;color:var(--quiet)}#hero-flow .substeps strong{color:var(--ink);font-weight:500}#hero-flow footer{border-top:1px solid var(--line);padding:16px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}#hero-flow .footer-copy{max-width:55%}#hero-flow label{display:block;margin:12px 0}#hero-flow input,#hero-flow textarea{display:block;width:100%;padding:10px;margin-top:6px;background:var(--paper);border:1px solid var(--line);border-radius:8px}#hero-flow .review-row{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}#hero-flow .review-row strong{display:block;font-weight:500}#hero-flow .end{padding:25px 0}#hero-flow .pill{display:inline-block;padding:3px 8px;border-radius:20px;background:var(--secondary);font-size:12px}#hero-flow .demo{font-size:12px;color:var(--quiet);margin-top:10px}

<div id="hero-flow"><header class="top"><span class="brand">Достать листы!</span><span class="quiet small">Создание героя · 1-й уровень</span></header><nav aria-label="Этапы создания"></nav><details class="summary"><summary id="hero-summary"></summary><p id="hero-values" class="quiet small"></p></details><main id="flow-main"></main><footer id="flow-footer"></footer><div class="demo">Интерактивный эскиз · сокращённый набор вариантов · герой в приложении не создаётся</div></div>
<script>
const DATA = {"classes": [{"name": "Тактик", "summary": "Стратег. Защитник. Лидер. С оружием в руках вы ведете союзников в пасть битвы, выкрикивая команды, которые вдохновляют ваших товарищей-героев двигаться быстрее и бить точнее. Все это время вы стоите между вашими соратниками и смертью, провоцируя приспешников зла одолеть вас, если они смогут.", "subclasses": [{"name": "Повстанец", "text": "Выполнять свой долг, играть по правилам и с честью умирать в бою — это работа вашего противника. Вы сделаете все возможное, чтобы сохранить жизнь своим союзникам. Вы получаете навык из группы навыков интриги."}, {"name": "Воевода", "text": "У вас есть энциклопедические знания о ведении войны, вы рассматриваете поле боя как игровую доску и ищете победу, продумывая шаги наперед ваших противников. Вы получаете навык из группы навыков знаний."}, {"name": "Авангард", "text": "Вы изучили стратегемы древних героев, что позволяет вам руководить с передовой и искать победы с помощью чистой силы воли и личности. Вы получаете навык из группы межличностных навыков."}], "levels": [[{"name": "Тактическая доктрина", "text": "#### Тактическая доктрина\n\nВедение войны так же старо, как цивилизация, а возможно, и еще старше. По мере того, как битвы становились все более сложными, военачальники изобрели тактическую доктрину, определяющую, как комбатанты должны быть структурированы, использованы и развернуты. Доктрину можно изучить в военных колледжах, передающих древние боевые традиции, или непосредственно через кровь и пот на поле боя. Какой бы путь ни привел вас к мастерству исторически проверенных тактик, вы выбираете тактическую доктрину из следующих вариантов, каждая из которых дает вам навык. (*Быстрый Билд:* Авангард и навык Запугивание.)\n\n- **Повстанец:** Выполнять свой долг, играть по правилам и с честью умирать в бою — это работа вашего противника. Вы сделаете все возможное, чтобы сохранить жизнь своим союзникам. Вы получаете навык из группы навыков интриги.\n- **Воевода:** У вас есть энциклопедические знания о ведении войны, вы рассматриваете поле боя как игровую доску и ищете победу, продумывая шаги наперед ваших противников. Вы получаете навык из группы навыков знаний.\n- **Авангард:** Вы изучили стратегемы древних героев, что позволяет вам руководить с передовой и искать победы с помощью чистой силы воли и личности. Вы получаете навык из группы межличностных навыков.\n\nВаша тактическая доктрина является вашим подклассом, и ваш выбор доктрины определяет многие особенности, которые вы получите при получении новых уровней.\n\n---\n"}, {"name": "Фокус", "text": "#### Фокус\n\nЗвон стали вызывает панику у других, но наводит порядок в вашем разуме, предоставляя вам героический ресурс, называемый фокусом.\n\n"}, {"name": "Фокус в бою", "text": "##### Фокус в бою\n\nВ начале боевой встречи или другой стрессовой ситуации, отслеживаемой в раундах боя (по решению Ведущего), вы получаете фокус, равный вашим Победам. В начале каждого вашего хода во время боя вы получаете 2 фокуса.\n\nДополнительно, первый раз за раунд боя, когда вы или любой союзник наносите урон существу, отмеченному вами (смотрите Метка ниже), вы получаете 1 фокус. В первый раз за раунд боя, когда любой союзник в пределах 10 клеток от вас использует героическую способность, вы получаете 1 фокус.\n\nВы теряете весь оставшийся фокус в конце боевой встречи.\n\n"}, {"name": "Фокус вне боя", "text": "##### Фокус вне боя\n\nХотя вы не можете получать фокус вне боя, вы можете использовать свои героические способности и эффекты, которые стоят фокуса, не тратя его. Всякий раз, когда вы используете способность или эффект вне боя, который стоит фокуса, вы не можете использовать ту же способность или эффект вне боя снова, пока не заработаете 1 или более Побед или не завершите отдых.\n\nКогда вы используете способность вне боя, которая позволяет вам потратить неограниченное количество фокуса на ее эффект, вы можете использовать ее так, как если бы вы потратили количество фокуса, равное вашим Победам. (Такие способности не являются частью основных правил тактика, но они могут появиться в будущих продуктах.)\n\n> **Объяснение способностей тактика**\n>\n> Многие из способностей тактика предоставляют союзникам дополнительное перемещение, урон и действия. Но что происходит в истории, чтобы позволить это? Тактик — невероятный стратег и вдохновляющий лидер, который быстро раздает команды и вдохновение, заставляющее его союзников действовать. Тактик может быстро читать поле боя, анализировать врагов, а затем выкрикивать приказы и ободрения, которые толкают его союзников к величию. Многие названия способностей тактика — это реальные команды, которые он дает своим друзьям!\n\n---\n"}, {"name": "Особенность доктрины 1-го уровня", "text": "#### Особенность доктрины 1-го уровня\n\nВаша тактическая доктрина дает вам особенность, как показано в таблице Особенностей доктрины 1-го уровня.\n\n###### Таблица особенностей доктрины 1-го уровня\n\n| Доктрина | Особенность |\n| ---------- | ------------------- |\n| Повстанец | Секретные операции |\n| Воевода | Образованный командир |\n| Авангард | Командирское присутствие |\n\n"}, {"name": "Командирское присутствие", "text": "##### Командирское присутствие\n\nВы командуете в любом помещении, в которое входите. Пока вы присутствуете на переговорах, каждый герой вместе с вами считает свою Славу на 2 выше, чем обычно. Дополнительно, каждый герой вместе с вами во время боевой встречи имеет двойное преимущество на тесты, сделанные, чтобы остановить бой и начать переговоры.\n\n"}], [{"name": "Перк", "text": "#### Перк\n\nВы получаете один перк исследования, межличностных навыков или интриги по вашему выбору. Смотрите [Перки](#/codex/1001).\n\n---\n"}, {"name": "Особенность доктрины 2-го уровня", "text": "#### Особенность доктрины 2-го уровня\n\nВаша тактическая доктрина дает вам особенность, как показано в таблице Особенностей доктрины 2-го уровня.\n\n###### Таблица особенностей доктрины 2-го уровня\n\n| Доктрина | Особенность |\n| ---------- | -------------------- |\n| Повстанец | Тактика проникновения |\n| Воевода | Спровоцированный |\n| Авангард | Превосходство в ближнем бою |\n\n"}, {"name": "Спровоцированный", "text": "##### Спровоцированный\n\nВы научились использовать психологию отмеченных вами врагов и подстрекать их к действию до того, как они будут тактически готовы. Всякий раз, когда существо, отмеченное вами, использует удар, нацеленный на вас или любого союзника в пределах вашей линии воздействия, вы можете использовать свободный триггер, чтобы изменить одну цель удара на себя или другого союзника в пределах вашей линии воздействия. Новая цель должна находиться на расстоянии способности и в пределах линии воздействия существа, использующего ее.\n\n"}, {"name": "Тактика проникновения", "text": "##### Тактика проникновения\n\nВы научили свой отряд работать вместе, хранить молчание и ждать подходящего момента для удара. Всякий раз, когда вы или любой союзник в пределах 10 клеток от вас становится скрытым, это существо получает 1 всплеск.\n\n"}, {"name": "Превосходство в ближнем бою", "text": "##### Превосходство в ближнем бою\n\nПосле постоянных тренировок вы можете более точно предвидеть план врага и пресекать его попытки перемещаться по полю боя. Всякий раз, когда вы совершаете атаку по возможности, скорость цели снижается до 0 до конца текущего хода.\n\n**Преимущество метки:** Когда существо, отмеченное вами, пытается переместиться или сместиться в пределах расстояния вашего свободного удара ближнего боя, вы можете использовать свободный триггер и потратить 2 фокуса, чтобы нанести по этому существу свободный удар ближнего боя.\n\n---\n"}, {"name": "Способность доктрины 2-го уровня", "text": "#### Способность доктрины 2-го уровня\n\nВаша тактическая доктрина дает вам на выбор одну из двух героических способностей.\n\n"}], [{"name": "Вне позиции", "text": "#### Вне позиции\n\nДаже до начала битвы ваши враги изо всех сил пытаются поспеть за вашей тактикой. В начале боевой встречи вы можете использовать свободный триггер, чтобы использовать способность Метка против одного врага, к которому у вас есть линия воздействия, даже если вы застигнуты врасплох. Затем вы можете совершить швыряние отмеченной цели вплоть до 3 клеток, игнорируя устойчивость. Цель не может быть перемещена таким образом, чтобы причинить ей вред (например, с обрыва), оставить ее при смерти или привести к тому, что она пострадает от состояния или другого негативного эффекта.\n\n---\n"}, {"name": "Способность за 7 фокуса", "text": "#### Способность за 7 фокуса\n\nВыберите одну героическую способность из следующих вариантов, каждая из которых стоит 7 фокуса для использования.\n\n"}, {"name": "Штурм с Фронта", "text": "> **Штурм с Фронта (7 Фокуса)**\n>\n> *Цель атаки с рывком — сломить их моральный дух и заставить отступить.*\n>\n> | **-** | **Маневр** |\n> | ----------- | -----------: |\n> | **📏 На себя** | **🎯 На себя** |\n>\n> **Эффект:** До конца боевой встречи или пока вы не окажетесь при смерти, в первый раз за ход, когда вы или любой союзник наносите урон цели, отмеченной вами, существо, нанесшее урон, может совершить толчок цели вплоть до 2 клеток, а затем сместиться вплоть до 2 клеток. Дополнительно, любой союзник, использующий основное действие Атака с рывком, чтобы нацелиться на существо, отмеченное вами, может использовать знаковую способность удара ближнего боя или героическую способность удара ближнего боя вместо свободного удара ближнего боя."}, {"name": "Бейте Их Сильно!", "text": "> **Бейте Их Сильно! (7 Фокуса)**\n>\n> *Ваши союзники видят преимущества в атаке выбранных вами целей.*\n>\n> | **-** | **Маневр** |\n> | ----------- | -----------: |\n> | **📏 На себя** | **🎯 На себя** |\n>\n> **Эффект:** До конца боевой встречи или пока вы не окажетесь при смерти, всякий раз, когда вы или любой союзник наносите урон цели, отмеченной вами, это существо получает 2 всплеска, которые оно может использовать немедленно."}, {"name": "Разгром", "text": "> **Разгром (7 Фокуса)**\n>\n> *Ситуация начинает меняться.*\n>\n> | **-** | **Маневр** |\n> | ----------- | -----------: |\n> | **📏 На себя** | **🎯 На себя** |\n>\n> **Эффект:** До конца боевой встречи или пока вы не окажетесь при смерти, всякий раз, когда вы или любой союзник наносите урон цели, отмеченной вами, которая имеет Р < СРЕДНИЙ, цель напугана существом, которое нанесло урон (до прох.)."}, {"name": "Держитесь и Сосредоточьтесь!", "text": "> **Держитесь и Сосредоточьтесь! (7 Фокуса)**\n>\n> *\"Мы можем это сделать! Сохраняйте веру и держитесь крепче!\"*\n>\n> | **-** | **Маневр** |\n> | ----------- | -----------: |\n> | **📏 На себя** | **🎯 На себя** |\n>\n> **Эффект:** До конца боевой встречи или пока вы не окажетесь при смерти, всякий раз, когда вы или любой союзник наносите урон цели, отмеченной вами, существо, нанесшее урон, может потратить Восстановление."}], [{"name": "Увеличение характеристик", "text": "#### Увеличение характеристик\n\nВаши показатели Мощи и Разума каждый увеличивается до 3.\n\n---\n"}, {"name": "Фокус на их слабости", "text": "#### Фокус на их слабости\n\nВ первый раз за каждый раунд боя, когда вы или любой союзник наносите урон цели, отмеченной вами, вы получаете 2 фокуса вместо 1.\n\n---\n"}, {"name": "Улучшенный полевой арсенал", "text": "#### Улучшенный полевой арсенал\n\nВаш опыт обращения с оружием вырос. Всякий раз, когда вы используете знаковую способность из одного из ваших экипированных комплектов или наносите свободный удар, используя оружие из одного из ваших экипированных комплектов, вы получаете преимущество.\n\n---\n"}, {"name": "Перк", "text": "#### Перк\n\nВы получаете один перк по вашему выбору.\n\n---\n"}, {"name": "Навык", "text": "#### Навык\n\nВы получаете один навык по вашему выбору. Смотрите [Навыки](#/codex/1208).\n\n"}], [{"name": "Особенности доктрины 5-го уровня", "text": "#### Особенности доктрины 5-го уровня\n\nВаша тактическая доктрина дает вам две особенности, как показано в таблице Особенностей доктрины 5-го уровня.\n\n###### Таблица особенностей доктрины 5-го уровня\n\n| Доктрина  | Особенности                        |\n| --------- | ---------------------------------- |\n| Повстанец | Отвлечение, Не оставлять следов    |\n| Воевода   | Замысел, Я это продумал            |\n| Авангард  | Стряхнуть, Тактическое наступление |\n\n"}, {"name": "Замысел", "text": "##### Замысел\n\nВы научились быть более превентивным на поле боя, продумывая больше шагов вперед, чем ваши противники. Вы можете нацелиться на двух существ с помощью способности Метка.\n\n"}, {"name": "Отвлечение", "text": "##### Отвлечение\n\nВы овладели способностью отвлекать врагов, что позволяет вам и вашим союзникам воспользоваться брешами в их внимании. Всякий раз, когда вы или любой союзник пытаетесь скрыться, любое существо, отмеченное вами, не считается наблюдателем. Дополнительно, вы и ваши союзники можете использовать других союзников в качестве укрытия для того, чтобы спрятаться.\n\n"}, {"name": "Я это продумал", "text": "##### Я это продумал\n\nВаш опыт в истории и знаниях позволяет вам и вашим союзникам перехитрить соперников в прямо здесь. Вы и любой союзник в пределах 10 клеток от вас получаете преимущество на тесты Разума.\n\n"}, {"name": "Не оставлять следов", "text": "##### Не оставлять следов\n\nВы и любой союзник в пределах 10 клеток от вас можете двигаться на полной скорости во время подкрадывания. Дополнительно, враги в пределах 10 клеток от вас получают помеху на тесты, сделанные для поиска вас или ваших союзников, пока любой из вас скрыт.\n\n"}, {"name": "Стряхнуть", "text": "##### Стряхнуть\n\nКак свободный маневр, вы можете потратить 1d6 Выносливости, чтобы проигнорировать последствие от теста, или чтобы завершить один эффект на вас, который заканчивается спасброском или который заканчивается в конце вашего хода. Любой союзник, смежный с вами, также может потратить Выносливость как свободный маневр, чтобы получить это преимущество.\n\n"}], [{"name": "Мастер оружия", "text": "#### Мастер оружия\n\nВаш опыт владения оружием вырос до истинного мастерства. Всякий раз, когда вы используете знаковую способность из одного из ваших экипированных комплектов или наносите свободный удар с использованием оружия из одного из ваших экипированных комплектов, вы можете нейтрализовать помеху на броске силы или уменьшить двойную помеху до помехи.\n\n---\n"}, {"name": "Перк", "text": "#### Перк\n\nВы получаете один перк исследования, межличностных навыков или интриги по вашему выбору.\n\n---\n"}, {"name": "Способность доктрины 6-го уровня", "text": "#### Способность доктрины 6-го уровня\n\nВаша тактическая доктрина дает вам на выбор одну из двух героических способностей.\n\n"}, {"name": "Способности Повстанца 6-го уровня", "text": "##### Способности Повстанца 6-го уровня\n\nВыберите одну из следующих способностей.\n\n"}, {"name": "Скоординированная Казнь", "text": "> **Скоординированная Казнь (9 Фокуса)**\n>\n> *Вы направляете своего союзника нанести смертельный удар.*\n>\n> | **Дальний** | **Свободный триггер** |\n> | ---------------- | -----------------: |\n> | **📏 Дальний 10** | **🎯 Один союзник** |\n>\n> **Триггер:** Цель использует способность для нанесения выброшенного урона существу, будучи скрытой.\n>\n> **Эффект:** Если цель вызвавшей триггер способности не является лидером или соло-существом, ее выносливость снижается до 0. Если цель вызвавшей триггер способности является миньоном, весь отряд погибает. Если цель вызвавшей триггер способности является лидером или соло-существом, бросок силы этой способности автоматически получает результат третьего тира."}, {"name": "Паника в Их Рядах", "text": "> **Паника в Их Рядах (9 Фокуса)**\n>\n> *Вы сбиваете своих врагов с толку, заставляя их ополчиться друг на друга.*\n>\n> | **Ближний, Дальний, Удар, Оружие** | **Основное действие** |\n> | --------------------------------- | -------------------: |\n> | **📏 Ближний 1 или дальний 5** | **🎯 Два существа** |\n>\n> **Бросок силы + Мощь:**\n>\n> - **≤11:** 6 + М урона; швыряние 1\n> - **12-16:** 9 + М урона; швыряние 3\n> - **17+:** 13 + М урона; швыряние 5\n>\n> **Эффект:** Если цель принудительно передвигается в другое существо, она должна нанести свободный удар по этому существу."}], [{"name": "Увеличение характеристик", "text": "#### Увеличение характеристик\n\nКаждая из ваших характеристик увеличивается на 1, до максимума 4.\n\n---\n"}, {"name": "Повышенный фокус", "text": "#### Повышенный фокус\n\nКогда вы получаете фокус в начале каждого вашего хода во время боя, вы получаете 3 фокуса вместо 2.\n\n---\n"}, {"name": "Захват инициативы", "text": "#### Захват инициативы\n\nЕсли вы не застигнуты врасплох в начале боя, ваша сторона получает право ходить первой. Если у врага есть способность, которая позволяет его стороне ходить первой, вы бросаете кубики как обычно, чтобы определить, кто ходит первым.\n\n---\n"}, {"name": "Навык", "text": "#### Навык\n\nВы получаете один навык по вашему выбору.\n\n---\n"}, {"name": "Особенность доктрины 7-го уровня", "text": "#### Особенность доктрины 7-го уровня\n\nВаша тактическая доктрина дает вам особенность, как показано в таблице Особенностей доктрины 7-го уровня.\n\n###### Таблица особенностей доктрины 7-го уровня\n\n| Доктрина | Особенность |\n| ---------- | ------------------ |\n| Повстанец | Асимметричная война |\n| Воевода | Гранд-стратегия |\n| Авангард | Шок и трепет |\n\n"}, {"name": "Асимметричная война", "text": "##### Асимметричная война\n\nВы развили свои навыки в уловках, теперь управляя полной стратегией и логистикой поля боя. Во время тест-монтажа или переговоров вы можете получить один автоматический успех в тесте, сделанном с использованием навыка из группы навыков интриги. Дополнительно, вы можете использовать навыки из группы навыков интриги, чтобы скрывать большие группы людей, таких как спасающиеся гражданские лица и группы партизанских бойцов.\n\n"}], [{"name": "Перк", "text": "#### Перк\n\nВы получаете один перк по вашему выбору.\n\n---\n"}, {"name": "Особенность доктрины 8-го уровня", "text": "#### Особенность доктрины 8-го уровня\n\nВаша тактическая доктрина дает вам особенность, как показано в таблице Особенностей доктрины 8-го уровня.\n\n###### Таблица особенностей доктрины 8-го уровня\n\n| Доктрина | Особенность |\n| ---------- | ---------------------------------- |\n| Повстанец | Приманка и засада |\n| Воевода | Клещевой маневр |\n| Авангард | Видеть, как враги бегут перед тобой |\n\n"}, {"name": "Приманка и засада", "text": "##### Приманка и засада\n\nВы обучили свой отряд быть бесшумными засадниками.\n\n**Преимущество метки:** Когда вы или любой союзник наносите удар по существу, отмеченному вами, вы можете потратить 2 фокуса, чтобы позволить персонажу, наносящему удар, сместиться на количество клеток вплоть до вашего показателя Разума и использовать маневр Скрытности как свободный маневр один раз во время смещения. Существо может сместиться до или после разрешения удара.\n\n"}, {"name": "Клещевой маневр", "text": "##### Клещевой маневр\n\nВы обучили свой отряд координировать свои движения, чтобы максимизировать влияние в бою.\n\n**Преимущество метки:** Когда вы или любой союзник наносите удар по существу, отмеченному вами, вы можете потратить 2 фокуса, чтобы заставить персонажа, наносящего удар, сместиться на количество клеток вплоть до вашего показателя Разума до разрешения удара. Если удар нанесли не вы, вы тоже можете совершить это смещение. Если вы нанесли удар, один союзник в пределах 10 клеток от вас также может совершить это смещение.\n\n"}, {"name": "Видеть, как враги бегут перед тобой", "text": "##### Видеть, как враги бегут перед тобой\n\nВы обучили свой отряд максимизировать воздействие и прорывать вражеские линии при их атаке.\n\n**Преимущество метки:** Когда вы или любой союзник наносите удар ближнего боя по существу, отмеченному вами, вы можете потратить 2 фокуса, чтобы заставить персонажа, наносящего удар, совершить толчок цели вплоть до числа клеток, равного вашему показателю Разума. Затем этот персонаж может сместиться на количество клеток вплоть до вашего показателя Разума, заканчивая это смещение смежно с целью.\n\n---\n"}, {"name": "Способность за 11 фокуса", "text": "#### Способность за 11 фокуса\n\nВыберите одну героическую способность из следующих вариантов, каждая из которых стоит 11 фокуса для использования.\n\n"}], [{"name": "Грандмастер оружия", "text": "#### Грандмастер оружия\n\nВаш опыт владения оружием вырос до истинного мастерства. Всякий раз, когда вы используете знаковую способность из одного из ваших экипированных комплектов или наносите свободный удар, используя оружие из одного из ваших экипированных комплектов, вы автоматически получаете результат третьего тира на бросок силы. Вы по-прежнему можете бросить кубики, чтобы определить, нанесете ли вы критическое попадание.\n\n---\n"}, {"name": "Способность доктрины 9-го уровня", "text": "#### Способность доктрины 9-го уровня\n\nВаша тактическая доктрина дает вам на выбор одну из двух героических способностей.\n\n"}, {"name": "Способности Повстанца 9-го уровня", "text": "##### Способности Повстанца 9-го уровня\n\nВыберите одну из следующих способностей.\n\n"}, {"name": "Отряд! Бей и Беги!", "text": "> **Отряд! Бей и Беги! (11 Фокуса)**\n>\n> *Мне пришлось выведать этот секрет у коллегий теней.*\n>\n> | **Дальний** | **Основное действие** |\n> | ---------------- | -------------------------: |\n> | **📏 Дальний 10** | **🎯 На себя и два союзника** |\n>\n> **Эффект:** Каждая цель получает 2 всплеска и может использовать свободный триггер, чтобы применить знаковую способность, которая получает преимущество. После разрешения своей способности каждая цель может сместиться вплоть до 2 клеток и стать скрытой, даже если у нее нет укрытия или покрова, или если за ней наблюдают."}, {"name": "Их Слабый Фокус — Их Гибель", "text": "> **Их Слабый Фокус — Их Гибель (11 Фокуса)**\n>\n> *Вы хитростью заставляете своих врагов атаковать друг друга и оставляете их в замешательстве от последствий.*\n>\n> | **Магия, Дальний, Оружие** | **Основное действие** |\n> | ------------------------- | -------------------: |\n> | **📏 Дальний 10** | **🎯 Три врага** |\n>\n> **Эффект:** Каждая цель использует знаковую способность против одной или нескольких целей по вашему выбору, причем каждая способность автоматически получает результат третьего тира на бросок силы. После разрешения способностей целей, вы делаете бросок силы против каждой исходной цели.\n>\n> **Бросок силы + Мощь:**\n>\n> - **≤11:** Р < СЛАБЫЙ, оглушение (до прох.)\n> - **12-16:** Р < СРЕДНИЙ, оглушение (до прох.)\n> - **17+:** Р < СИЛЬНЫЙ, оглушение (до прох.)"}, {"name": "Способности Воеводы 9-го уровня", "text": "##### Способности Воеводы 9-го уровня\n\nВыберите одну из следующих способностей.\n\n"}], [{"name": "Увеличение характеристик", "text": "#### Увеличение характеристик\n\nВаши показатели Мощи и Разума каждый увеличивается до 5.\n\n---\n"}, {"name": "Командование", "text": "#### Командование\n\nУ вас есть эпический ресурс, называемый командованием. Каждый раз, когда вы заканчиваете отдых, вы получаете командование, равное полученному вами Опыту. Вы можете тратить командование на свои способности так, как если бы это был фокус.\n\nДополнительно, всякий раз, когда вы или любой союзник используете способность для нанесения выброшенного урона существу, отмеченному вами, вы можете потратить 1 командование как свободный триггер, чтобы увеличить результат броска силы для этой цели на один тир. Всякий раз, когда враг, отмеченный вами, делает бросок способности, вы можете потратить 1 командование как свободный триггер, чтобы уменьшить результат броска силы на один тир.\n\nКомандование сохраняется, пока вы его не потратите.\n\n---\n"}, {"name": "Перк", "text": "#### Перк\n\nВы получаете один перк исследования, межличностных навыков или интриги по вашему выбору.\n\n---\n"}, {"name": "Навык", "text": "#### Навык\n\nВы получаете один навык по вашему выбору.\n\n---\n"}, {"name": "Истинный фокус", "text": "#### Истинный фокус\n\nКогда вы получаете фокус в начале каждого вашего хода во время боя, вы получаете 4 фокуса вместо 3.\n\n---\n"}, {"name": "Мастер войны", "text": "#### Мастер войны\n\nВы овладели всей полнотой возможных стратегий и тактик. Всякий раз, когда вы или любой союзник делаете бросок способности против цели, отмеченной вами, персонаж, делающий бросок, может бросить три кубика и выбрать, какие два использовать.\n\nДополнительно, всякий раз, когда союзник использует героическую способность, нацеленную на одно или несколько существ, отмеченных вами, он тратит на 2 меньше своего героического ресурса на эту способность (минимум 1)."}]]}, {"name": "Тень", "summary": "Скрытность — это ваше искусство, острие клинка — ваша кисть. Вы обучались в тайной коллегии, специализируясь на алхимии, иллюзиях или теневой магии. Ваше обучение и знания ставят вас в один ряд с элитными убийцами, шпионами и коммандос. Но более могущественным, чем любое оружие или колдовство, является ваше прозрение относительно слабостей ваших врагов.", "subclasses": [{"name": "Коллегия Черного Пепла", "text": "Коллегия Черного Пепла основала искусство быть тенью. Ее выпускники не имеют себе равных в мобильности, используя колдовство для телепортации по полю боя, манипулирования тенями и призыва тьмы. У вас есть навык Магия."}, {"name": "Коллегия Едкой Алхимии", "text": "Коллегия Едкой Алхимии учит своих студентов рецептам кислот, бомб и ядов, используемых в их мрачной работе. Выпускники коллегии — исключительные убийцы. У вас есть навык Алхимия."}, {"name": "Коллегия Маски Арлекина", "text": "Выпускники Коллегии Маски Арлекина изучают магию иллюзий, которую они используют для проникновения во вражеские твердыни и создания спланированного хаоса в бою. У вас есть навык Обман."}], "levels": [[{"name": "Коллегия тени", "text": "#### Коллегия тени\n\nКоллегии теней — это тайные учреждения, которые превращают обычных людей в нечто иное. Поиск коллегии — это первый шаг в строгом процессе посвящения, который проверяет характер претендента. Даже те, кто проходит отбор, часто вылетают — или их выгоняют, — поскольку мастера-тени, которые обучают студентов скрытности, магии и убийствам, часто бывают далеко не мягкими в своем подходе.\n\nВы окончили коллегию теней, выбранную из следующих вариантов, каждая из которых дает вам навык. (*Быстрый Билд:* Коллегия Черного Пепла.)\n\n- **Коллегия Черного Пепла (College of Black Ash):** Коллегия Черного Пепла основала искусство быть тенью. Ее выпускники не имеют себе равных в мобильности, используя колдовство для телепортации по полю боя, манипулирования тенями и призыва тьмы. У вас есть навык Магия.\n- **Коллегия Едкой Алхимии (College of Caustic Alchemy):** Коллегия Едкой Алхимии учит своих студентов рецептам кислот, бомб и ядов, используемых в их мрачной работе. Выпускники коллегии — исключительные убийцы. У вас есть навык Алхимия.\n- **Коллегия Маски Арлекина (College of the Harlequin Mask):** Выпускники Коллегии Маски Арлекина изучают магию иллюзий, которую они используют для проникновения во вражеские твердыни и создания спланированного хаоса в бою. У вас есть навык Обман.\n\nВаша коллегия тени является вашим подклассом, и ваш выбор коллегии определяет многие особенностии, которые вы получите по мере повышения уровней.\n\n---\n"}, {"name": "Прозрение", "text": "#### Прозрение\n\nНаблюдая за врагом, вы учитесь использовать его слабости против него самого, накапливая героический ресурс, называемый прозрением.\n\n"}, {"name": "Прозрение в бою", "text": "##### Прозрение в бою\n\nВ начале боевой встречи или другой стрессовой ситуации, отслеживаемой в раундах боя (по решению Ведущего), вы получаете прозрение, равное вашим Победам. В начале каждого вашего хода во время боя вы получаете 1d3 прозрения.\n\nДополнительно, первый раз за раунд боя, когда вы наносите урон, включающий 1 или более всплесков, вы получаете 1 прозрения.\n\nВсякий раз, когда вы используете героическую способность, которая использует бросок силы, эта способность стоит на 1 прозрение меньше, если у вас есть преимущество или двойное преимущество на нее. Если у способности несколько целей, стоимость снижается, даже если способность получает преимущество или имеет двойное преимущество только против одной цели.\n\nВы теряете все оставшееся прозрение в конце боевой встречи.\n\n"}, {"name": "Прозрение вне боя", "text": "##### Прозрение вне боя\n\nХотя вы не можете получать прозрение вне боя, вы можете использовать свои героические способности и эффекты, которые стоят прозрения, не тратя его. Всякий раз, когда вы используете способность или эффект вне боя, который стоит прозрения, вы не можете использовать ту же способность или эффект вне боя снова, пока не заработаете 1 или более Побед или не завершите отдых.\n\nКогда вы используете способность вне боя, которая позволяет вам потратить неограниченное количество прозрения на ее эффект, такую как Телепортация Черного Пепла, вы можете использовать ее так, как если бы вы потратили количество прозрения, равное вашим Победам.\n\n---\n"}, {"name": "Особенности коллегии 1-го уровня", "text": "#### Особенности коллегии 1-го уровня\n\nВаша коллегия тени дает вам одну или две особенностии, как показано в таблице Особенностей коллегии 1-го уровня.\n\n###### Таблица особенностей коллегии 1-го уровня\n\n| Коллегия | Особенность |\n| --------------- | -------------------------- |\n| Черный Пепел | Телепортация Черного Пепла |\n| Едкая Алхимия | Смазать клинок, Дымовая бомба |\n| Маска Арлекина | Я не угроза |\n\n"}, {"name": "Телепортация Черного Пепла", "text": "##### Телепортация Черного Пепла\n\nУ вас есть следующая способность.\n\n"}], [{"name": "Перк", "text": "#### Перк\n\nВы получаете один перк исследования, межличностных навыков или интриги по вашему выбору. Смотрите [Перки](#/codex/1001).\n\n---\n"}, {"name": "Особенность коллегии 2-го уровня", "text": "#### Особенность коллегии 2-го уровня\n\nВаша коллегия тени дает вам особенность, как показано в таблице Особенностей коллегии 2-го уровня.\n\n###### Таблица особенностей коллегии 2-го уровня\n\n| Коллегия | Особенность |\n| --------------- | ---------------- |\n| Черный Пепел | Горящий пепел |\n| Едкая Алхимия | Обученный убийца |\n| Маска Арлекина | Друг! |\n\n"}, {"name": "Горящий пепел", "text": "##### Горящий пепел\n\nПепел, который вы оставляете после себя, обжигает ваших врагов. В первый раз за ход, когда вы используете способность тени для телепортации из или на клетку, смежную с врагом, этот враг получает урон огнем, равный показателю вашей Ловкости.\n\n"}, {"name": "Друг!", "text": "##### Друг!\n\nВаши иллюзии заставляют врагов поверить, что вы их друг в критические моменты. Всякий раз, когда враг использует способность или черту, нацеленную на нескольких союзников, и вы находитесь в пределах расстояния эффекта, вы можете выбрать стать целью этого эффекта тоже.\n\nДополнительно, когда вы используете свою способность Я не угроза, вы можете использовать Действие отхода как часть этой способности.\n\n"}, {"name": "Обученный убийца", "text": "##### Обученный убийца\n\nВы знаете, куда именно бить своих врагов. Всякий раз, когда вы наносите удар, не имеющий помехи или двойной помехи, и который включает 1 или более всплесков, вы получаете 1 дополнительный всплеск, который можно использовать только на этот удар.\n\n---\n"}, {"name": "Способность коллегии 2-го уровня", "text": "#### Способность коллегии 2-го уровня\n\nВаша коллегия тени дает вам на выбор одну из двух героических способностей.\n\n"}], [{"name": "Внимательное наблюдение", "text": "#### Внимательное наблюдение\n\nУ вас есть следующая способность.\n\n"}, {"name": "Внимательное Наблюдение", "text": "> **Внимательное Наблюдение**\n>\n> *Момент концентрации оставляет врага под вашим пристальным прицелом.*\n>\n> | **Дальний** | **Маневр** |\n> | ---------------- | ------------------: |\n> | **📏 Дальний 20** | **🎯 Одно существо** |\n>\n> **Эффект:** Пока вы остаетесь в пределах расстояния до цели, сохраняете к ней линию воздействия и не бьете ни по какому другому существу первым, вы получаете преимущество на следующий удар, который вы наносите по оцениваемому существу, и получаете 1 всплеск, который вы можете использовать только на этот удар."}, {"name": "Способность за 7 прозрения", "text": "#### Способность за 7 прозрения\n\nВыберите одну героическую способность из следующих вариантов, каждая из которых стоит 7 прозрения для использования.\n\n"}, {"name": "Танцор", "text": "> **Танцор (7 Прозрения)**\n>\n> *Вы входите в состояние потока, из-за которого вас почти невозможно загнать в угол.*\n>\n> | **-** | **Маневр** |\n> | ----------- | -----------: |\n> | **📏 На себя** | **🎯 На себя** |\n>\n> **Эффект:** До конца боевой встречи, всякий раз, когда враг перемещается или подвергается принудительному движению смежно с вами или наносит вам урон, вы можете использовать Действие отхода как свободный триггер."}, {"name": "Отвлекающий Удар", "text": "> **Отвлекающий Удар (7 Прозрения)**\n>\n> *\"Почему ты смотришь на МЕНЯ?!\"*\n>\n> | **Ближний, Дальний, Удар, Оружие** | **Основное действие** |\n> | --------------------------------- | ------------------: |\n> | **📏 Ближний 1 или дальний 5** | **🎯 Одно существо** |\n>\n> **Бросок силы + Ловкость:**\n>\n> - **≤11:** 9 + Л урона\n> - **12-16:** 13 + Л урона\n> - **17+:** 18 + Л урона\n>\n> **Эффект:** Цель спровоцирована согласным союзником в пределах 5 клеток от вас до конца следующего хода цели."}, {"name": "Пригвождающий Выстрел", "text": "> **Пригвождающий Выстрел (7 Прозрения)**\n>\n> *Один снаряд — пущенный точно и жестко.*\n>\n> | **Дальний, Удар, Оружие** | **Основное действие** |\n> | -------------------------- | ------------------: |\n> | **📏 Дальний 5** | **🎯 Одно существо** |\n>\n> **Бросок силы + Ловкость:**\n>\n> - **≤11:** 8 + Л урона; Л < СЛАБЫЙ, опутанность (до прох.)\n> - **12-16:** 12 + Л урона; Л < СРЕДНИЙ, опутанность (до прох.)\n> - **17+:** 16 + Л урона; Л < СИЛЬНЫЙ, опутанность (до прох.)"}], [{"name": "Увеличение характеристик", "text": "#### Увеличение характеристик\n\nВаш показатель Ловкости увеличивается до 3. Дополнительно, вы можете увеличить один из ваших показателей характеристик на 1, до максимума 3.\n\n---\n"}, {"name": "Потише", "text": "#### Потише\n\nРазговаривая с любым существом, с которым у вас есть общий язык, вы можете решать, сможет ли кто-нибудь еще воспринимать то, что вы передаете, даже если вы кричите.\n\n---\n"}, {"name": "Ночной дозор", "text": "#### Ночной дозор\n\nВаше чувство скрытности показывает окружающим, как избежать внимания. Пока вы скрыты, враги получают помеху на тесты, сделанные для поиска вас или других скрытых существ в пределах 10 клеток от вас.\n\nДополнительно, у вас есть следующая способность.\n\n"}, {"name": "Ночной Дозор", "text": "> **Ночной Дозор**\n>\n> *Стальной кинжал из ниоткуда сбивает другое оружие с курса.*\n>\n> | **Дальний, Оружие** | **Триггер** |\n> | ------------------ | --------------: |\n> | **📏 Дальний 5** | **🎯 Один союзник** |\n>\n> **Триггер:** Цель получает урон от способности другого существа, пока вы скрыты.\n>\n> **Эффект:** Цель получает половину урона. Вы остаетесь скрытыми."}, {"name": "Перк", "text": "#### Перк\n\nВы получаете один перк по вашему выбору.\n\n---\n"}, {"name": "Навык", "text": "#### Навык\n\nВы получаете один навык по вашему выбору. Смотрите [Навыки](#/codex/1208).\n\n---\n"}], [{"name": "Особенность коллегии 5-го уровня", "text": "#### Особенность коллегии 5-го уровня\n\nВаша коллегия тени дает вам особенность, как показано в таблице Особенностей коллегии 5-го уровня.\n\n###### Таблица особенностей коллегии 5-го уровня\n\n| Коллегия | Особенность |\n| --------------- | ----------------- |\n| Черный Пепел | След пепла |\n| Едкая Алхимия | Нестабильные реагенты |\n| Маска Арлекина | Гамбит арлекина |\n\n"}, {"name": "Гамбит арлекина", "text": "##### Гамбит арлекина\n\nВсякий раз, когда вы снижаете выносливость смежного существа, не являющегося миньоном, до 0, вы можете немедленно использовать свободный маневр, чтобы использовать свою способность Я не угроза, а затем переместиться вплоть до вашей скорости.\n\nЕсли существо того же размера, что и вы, вы можете замаскироваться под него с помощью Я не угроза, не тратя прозрение. Если вы это сделаете, пока активно Я не угроза, тело существа замаскировано под ваше тело. Иллюзия на его теле заканчивается, если другое существо физически взаимодействует с ним. Когда иллюзия должна закончиться для вас или для тела существа, она заканчивается для обоих.\n\n"}, {"name": "След пепла", "text": "##### След пепла\n\nВсякий раз, когда вы снижаете выносливость существа, не являющегося миньоном, до 0, вы можете немедленно использовать свободный маневр, чтобы использовать свою способность Телепортация Черного Пепла.\n\nДополнительно, теперь вы можете брать с собой смежное согласное существо всякий раз, когда используете способность тени для телепортации. Существо появляется на свободной клетке, смежной с клеткой, на которую вы телепортировались. Если такой клетки не существует, оно не может телепортироваться с вами.\n\n"}, {"name": "Нестабильные реагенты", "text": "##### Нестабильные реагенты\n\nВсякий раз, когда вы получаете урон, каждый враг, смежный с вами, получает урон огнем, кислотой или ядом (по вашему выбору), равный показателю вашей Ловкости.\n\nДополнительно, ваша способность Защитный перекат теперь позволяет вам сместиться вплоть до 5 клеток, включая смещение по вертикали. Если вы не заканчиваете это смещение на твердой земле и не летите, вы падаете.\n\n---\n"}, {"name": "Способность за 9 прозрения", "text": "#### Способность за 9 прозрения\n\nВыберите одну героическую способность из следующих вариантов, каждая из которых стоит 9 прозрения для использования.\n\n"}, {"name": "Затемнение", "text": "> **Затемнение (9 Прозрения)**\n>\n> *Вы заставляете тень вырваться из ваших глаз и создаете облако тьмы.*\n>\n> | **Область, Магия** | **Маневр** |\n> | --------------- | -------------: |\n> | **📏 Взрыв 3** | **🎯 Особая** |\n>\n> **Эффект:** Черное облако заполняет область до конца вашего следующего хода, предоставляя вам и вашим союзникам покров против врагов. Пока вы находитесь в области, всякий раз, когда враг заканчивает свой ход в области, вы можете использовать свободный триггер, чтобы сместиться в новое место в пределах области и нанести по нему свободный удар."}], [{"name": "Перк", "text": "#### Перк\n\nВы получаете один перк по вашему выбору.\n\n---\n"}, {"name": "Теневая форма", "text": "#### Теневая форма\n\nКак маневр, вы теряете контроль над собой, становясь теневым существом, с которого капает пепел. Эта трансформация длится до конца боевой встречи, пока вы не окажетесь при смерти или после 1 непрерывного часа тихой концентрации вне боя. Вы получаете следующие эффекты, находясь в этой форме:\n\n- Вы можете автоматически лазить на полной скорости во время движения.\n- Клетки врагов не считаются для вас труднопроходимой местностью. Враг получает урон порчей, равный показателю вашей Ловкости, когда вы впервые проходите через его пространство за ход.\n- Если вы заканчиваете свой ход с укрытием или покровом от другого существа, вы автоматически скрыты от этого существа.\n- Вы получаете 1 всплеск в начале каждого вашего хода.\n- У вас есть иммунитет к урону порчей, равный 5 + ваш уровень.\n- Существа получают преимущество на удары против вас.\n- Вы получаете помеху на тесты Присутствия, сделанные для взаимодействия с другими существами.\n\n---\n"}, {"name": "Способность коллегии 6-го уровня", "text": "#### Способность коллегии 6-го уровня\n\nВаша коллегия тени дает вам на выбор одну из двух героических способностей.\n\n"}, {"name": "Способности Черного Пепла 6-го уровня", "text": "##### Способности Черного Пепла 6-го уровня\n\nВыберите одну из следующих способностей.\n\n"}, {"name": "Извержение Черного Пепла", "text": "> **Извержение Черного Пепла (9 Прозрения)**\n>\n> *Ваша атака создает облако черного пепла, которое подбрасывает врага в воздух.*\n>\n> | **Магия, Ближний, Удар, Оружие** | **Основное действие** |\n> | -------------------------------- | ------------------: |\n> | **📏 Ближний 1** | **🎯 Одно существо** |\n>\n> **Бросок силы + Ловкость:**\n>\n> - **≤11:** 3 + Л урона; вертикальное швыряние 5\n> - **12-16:** 6 + Л урона; вертикальное швыряние 10\n> - **17+:** 9 + Л урона; вертикальное швыряние 15\n>\n> **Эффект:** Существо, подвергнутое принудительному движению этой способностью, должно быть перемещено прямо вверх."}, {"name": "Пепельная Буря", "text": "> **Пепельная Буря (9 Прозрения)**\n>\n> *Вы телепортируете своих друзей во взрыве пепла и огня.*\n>\n> | **Магия** | **Маневр** |\n> | -------------- | ------------------------------------: |\n> | **📏 Взрыв 4** | **🎯 На себя и каждого союзника в области** |\n>\n> **Эффект:** Каждая цель может телепортироваться вплоть до 5 клеток. За каждую цель помимо вас, которая телепортируется от врага или на смежную с ним клетку, этот враг получает урон огнем, равный показателю вашей Ловкости. Дополнительно, цель, которая заканчивает это перемещение с покровом или укрытием, может использовать маневр Скрытности, даже если за ней наблюдают."}], [{"name": "Увеличение характеристик", "text": "#### Увеличение характеристик\n\nКаждая из ваших характеристик увеличивается на 1, до максимума 4.\n\n---\n"}, {"name": "Острое прозрение", "text": "#### Острое прозрение\n\nВ начале каждого вашего хода во время боя вы получаете 1d3 + 1 прозрения вместо 1d3.\n\n---\n"}, {"name": "Навык", "text": "#### Навык\n\nВы получаете один навык по вашему выбору.\n\n---\n"}, {"name": "Улучшение внимательного наблюдения", "text": "#### Улучшение внимательного наблюдения\n\nВы можете нацелиться на двух существ одновременно с помощью вашей способности Внимательное наблюдение, наблюдая за обоими одновременно. Нанесение удара по одной цели не отменяет ваше наблюдение за другой целью.\n\n---\n"}, {"name": "Чревовещатель", "text": "#### Чревовещатель\n\nВсякий раз, когда вы общаетесь, вы можете проецировать свой голос так, чтобы казалось, будто он исходит от существа или объекта в пределах 10 клеток. Если вы скрыты, такой разговор не приведет к тому, что вас обнаружат."}], [{"name": "Перк", "text": "#### Перк\n\nВы получаете один перк по вашему выбору.\n\n---\n"}, {"name": "Особенность коллегии 8-го уровня", "text": "#### Особенность коллегии 8-го уровня\n\nВаша коллегия тени дает вам особенность, как показано в таблице Особенностей коллегии 8-го уровня.\n\n###### Таблица особенностей коллегии 8-го уровня\n\n| Коллегия | Особенность |\n| --------------- | ----------- |\n| Черный Пепел | Пепельный шаг |\n| Едкая Алхимия | Бомба замедленного действия |\n| Маска Арлекина | Паркур |\n\n"}, {"name": "Пепельный шаг", "text": "##### Пепельный шаг\n\nВсякий раз, когда вы добровольно перемещаетесь, вы можете телепортироваться. Когда вы телепортируетесь таким образом, это считается использованием способности тени для целей использования ваших особенностей Горящий пепел и След пепла.\n\n"}, {"name": "Паркур", "text": "##### Паркур\n\nВаше движение больше не провоцирует атаки по возможности. Дополнительно, вы можете использовать вашу особенность Гамбит арлекина как свободный триггер, когда выносливость существа снижается до 0 вашей способностью Умный трюк.\n\n"}, {"name": "Бомба замедленного действия", "text": "##### Бомба замедленного действия\n\nВы имеете иммунитет к урону от способностей и эффектов по области, равный показателю вашей Ловкости. У вас также есть следующая способность, которую вы можете использовать один раз за раунд в свой ход.\n\n"}, {"name": "Бомба Замедленного Действия", "text": "> **Бомба Замедленного Действия**\n>\n> *Чем дольше она готовится, тем больше взрыв.*\n>\n> | **Область, Дальний** | **Свободный маневр** |\n> | ----------------------- | ----------------------------: |\n> | **📏 Куб 2 в пределах 10** | **🎯 Каждый враг в области** |\n>\n> **Эффект:** Каждая цель получает урон кислотой, огнем или ядом (по вашему выбору), равный показателю вашей Ловкости.\n>\n> За каждый раунд боя, прошедший с момента последнего использования этой способности в текущем столкновении, область увеличивается на 1, и вы получаете 1 всплеск, который должен быть использован с этой способностью. После использования способности или в конце боевой встречи ее область и всплески сбрасываются.\n>\n> **Потратить 2+ Прозрения:** За каждые 2 потраченных прозрения вы увеличиваете размер куба на 1 и получаете 1 всплеск, который можно использовать только с этой способностью."}], [{"name": "Мрачный отряд", "text": "#### Мрачный отряд\n\nВ начале каждого вашего хода вы можете отказаться от получения прозрения, чтобы создать 1d6 своих клонов на свободных смежных клетках. Клон действует в ваш ход и использует ваши характеристики, за исключением того, что у него 1 Выносливость. На них влияют любые состояния и эффекты, действующие на вас, и они существуют до начала вашего следующего хода. Клон не имеет прозрения и не может использовать способность Внимательное наблюдение, особенность Теневая форма или любые триггеры. В свой ход у клона есть действие движения, маневр и основное действие, которое он может использовать только для нанесения свободного удара. Нанося свободный удар, клон должен выбирать цели, по которым вы или другой клон также не наносите удар.\n\nВне боя вы можете иметь одного активного клона за каждые 2 Победы, которые у вас есть. Если клон уничтожен, вы должны подождать 1 час, прежде чем создать другого.\n\n---\n"}, {"name": "Способность коллегии 9-го уровня", "text": "#### Способность коллегии 9-го уровня\n\nВаша коллегия тени дает вам на выбор одну из двух героических способностей.\n\n"}, {"name": "Способности Черного Пепла 9-го уровня", "text": "##### Способности Черного Пепла 9-го уровня\n\nВыберите одну из следующих способностей.\n\n"}, {"name": "Какофония Пепла", "text": "> **Какофония Пепла (11 Прозрения)**\n>\n> *Вы кувыркаетесь в битве, нанося удары врагам и телепортируя союзников.*\n>\n> | **Магия, Ближний, Оружие** | **Основное действие** |\n> | ------------------------ | --------------: |\n> | **📏 На себя; смотрите ниже** | **🎯 На себя** |\n>\n> **Эффект:** Вы смещаетесь на расстояние вплоть до вашей удвоенной скорости, делая один бросок силы, который нацелен на каждое существо, с которым вы становитесь смежными во время смещения.\n>\n> **Бросок силы + Ловкость:**\n>\n> - **≤11:** Враг получает 6 урона; союзник может телепортироваться вплоть до 3 клеток.\n> - **12-16:** Враг получает 10 урона; союзник может телепортироваться вплоть до 5 клеток.\n> - **17+:** Враг получает 14 урона; союзник может телепортироваться вплоть до 7 клеток."}, {"name": "Демоническая Дверь", "text": "> **Демоническая Дверь (11 Прозрения)**\n>\n> *Вы создаете временный портал, чтобы сквозь него могла просунуться огромная демоническая рука.*\n>\n> | **Магия, Ближний, Удар, Оружие** | **Основное действие** |\n> | -------------------------------- | ------------------: |\n> | **📏 Ближний 3** | **🎯 Одно существо** |\n>\n> **Бросок силы + Ловкость:**\n>\n> - **≤11:** 13 + Л урона порчей; толчок 3\n> - **12-16:** 18 + Л урона порчей; толчок 5\n> - **17+:** 25 + Л урона порчей; толчок 7\n>\n> **Эффект:** При критическом попадании цель схвачена демоном и затянута в портал до того, как он закроется, и ее больше никогда не увидят."}, {"name": "Способности Едкой Алхимии 9-го уровня", "text": "##### Способности Едкой Алхимии 9-го уровня\n\nВыберите одну из следующих способностей.\n\n"}], [{"name": "Увеличение характеристик", "text": "#### Увеличение характеристик\n\nВаш показатель Ловкости увеличивается до 5. Дополнительно, вы можете увеличить один из ваших показателей характеристик на 1, до максимума 5.\n\n---\n"}, {"name": "Ресурс смерти", "text": "#### Ресурс смерти\n\nВ первый раз за раунд боя, когда вы наносите урон, включающий 1 или более всплесков, вы получаете 3 прозрения вместо 2.\n\n---\n"}, {"name": "Перк", "text": "#### Перк\n\nВы получаете один перк по вашему выбору.\n\n---\n"}, {"name": "Навык", "text": "#### Навык\n\nВы получаете один навык по вашему выбору.\n\n---\n"}, {"name": "Улучшение внимательного наблюдения", "text": "#### Улучшение внимательного наблюдения\n\nВы можете нацелиться на трех существ одновременно с помощью вашей способности Внимательное наблюдение.\n\n---\n"}, {"name": "Улучшенная теневая форма", "text": "#### Улучшенная теневая форма\n\nВы получаете полный контроль над теневым существом, которым вы становитесь с помощью Особенности Теневая форма, и вы можете закончить трансформацию по желанию (действие не требуется). Дополнительно, вы всегда окутаны тьмой, которая дает вам покров, пока вы находитесь в этой форме, и существа больше не получают преимущество на удары против вас.\n\nПока вы находитесь в своей теневой форме, вы можете потратить 1 непрерывную минуту, концентрируясь на месте, где вы были раньше. В конце этой минуты вы и каждое согласное существо по вашему выбору в пределах 10 клеток от вас можете телепортироваться на свободные клетки по вашему выбору в этом месте. Каждое существо, телепортирующееся таким образом, невидимо в течение 1 часа или до тех пор, пока оно не использует способность.\n\n---\n"}]]}, {"name": "Неистовый", "summary": "Вы не усмиряете пыл битвы внутри себя. Вы высвобождаете его! Ваш опыт выживания в дикой природе открыл вам секреты хищников, и теперь, подобно хищной птице, пантере или волку, вы направляете безудержный гнев в боевое мастерство. Первозданный Хаос — ваш союзник. Пусть другие используют утонченность, чтобы разгребать обломки, оставленные вами.", "subclasses": [{"name": "Берсерк", "text": "Вы направляете свою свирепость в физическую мощь, действуя как живая версия сил, формирующих мир. У вас есть навык Лифтинг."}, {"name": "Разоритель", "text": "Вы направляете свою свирепость в инстинкты и хитрость, бросая вызов порядку цивилизации. У вас есть навык Скрытность."}, {"name": "Буревестник", "text": "Вы направляете свою свирепость в первозданные штормы и можете принимать форму животного или форму гибрида. У вас есть навык Выслеживание."}], "levels": [[{"name": "Первозданный аспект", "text": "#### Первозданный аспект\nВы являетесь продуктом обычаев, которые старше войн, старше цивилизации, старше большей части мира. Вы прошли обряд посвящения, который раскрыл основывающие блоки мультивселенной — Первозданный Хаос — и который оставил аспект этого хаоса внутри вас. Вы выбираете первозданный аспект из следующих вариантов, каждый из которых дает вам навык. (*Быстрый Билд:* Берсерк.)\n\n- **Берсерк:** Вы направляете свою свирепость в физическую мощь, действуя как живая версия сил, формирующих мир. У вас есть навык Лифтинг.\n- **Разоритель:** Вы направляете свою свирепость в инстинкты и хитрость, бросая вызов порядку цивилизации. У вас есть навык Скрытность.\n- **Буревестник:** Вы направляете свою свирепость в первозданные штормы и можете принимать форму животного или форму гибрида. У вас есть навык Выслеживание.\n\nВаш первозданный аспект является вашим подклассом, и выбор аспекта определяет многие особенности, которые вы получите при получении новых уровней.\n\n---\n"}, {"name": "Свирепость", "text": "#### Свирепость\nВ пылу битвы ваша решимость и гнев растут, питая героический ресурс под названием свирепость.\n\n> **Где мой маневр?**\n>\n> Поскольку большинство других классов получают особый маневр, вы можете задаться вопросом: \"Где специальный маневр для неистового?\" Ответ заключается в том, что классу не нужен собственный маневр, потому что большую часть времени фентези неистового заставляет его использовать маневры Захвата или Отталкивания в бою. Они также очень хороши в этих маневрах, поэтому нет смысла давать вам еще один вариант, который вы будете редко или вообще никогда не использовать.\n"}, {"name": "Свирепость в бою", "text": "##### Свирепость в бою\nВ начале боевой встречи или другой стрессовой ситуации, отслеживаемой в раундах боя (по решению Ведущего), вы получаете свирепость, равную вашим Победам. В начале каждого вашего хода во время боя вы получаете 1d3 свирепости.\n\nДополнительно, первый раз за раунд боя, когда вы получаете урон, вы получаете 1 свирепости. В первый раз, когда вы входите в состояние утомления или находитесь при смерти в боевой встрече, вы получаете 1d3 свирепости.\n\nВы теряете всю оставшуюся свирепость в конце боевой встречи.\n"}, {"name": "Свирепость вне боя", "text": "##### Свирепость вне боя\nХотя вы не можете получать свирепость вне боя, вы можете использовать свои героические способности и эффекты, которые стоят свирепости, не тратя ее. Всякий раз, когда вы используете способность или эффект вне боя, который стоит свирепости, вы не можете использовать ту же способность или эффект вне боя снова, пока не заработаете 1 или более Побед или не завершите отдых.\n\nКогда вы используете способность вне боя, которая позволяет вам потратить неограниченное количество свирепости на ее эффект, такую как \"До самого конца\", вы можете использовать ее так, как если бы вы потратили количество свирепости, равное вашим Победам.\n\n---\n"}, {"name": "Растущая свирепость", "text": "#### Растущая свирепость\nВы получаете определенные преимущества в бою в зависимости от количества свирепости, которое у вас есть (подробности смотрите в Особенности аспекта 1-го уровня). Эти преимущества длятся до конца вашего хода, даже если преимущество станет недоступным для вас из-за количества свирепости, которое вы тратите во время своего хода.\n\nНекоторые преимущества Растущей свирепости могут быть применены только в том случае, если вы достигли определенного уровня или выше, причем уровень этих преимуществ указан в различных таблицах Растущей свирепости в этом разделе.\n###### Таблица Растущей свирепости Берсерка\n\n|    Свирепость     | Преимущество                                                                                                                                                                                                                                                                                            |\n| :---------------: | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n|         2         | Всякий раз, когда вы используете маневр Отталкивания, расстояние принудительного движения получает бонус, равный показателю вашей Мощи.                                                                                                                                                                 |\n|         4         | В первый раз, когда вы совершаете толчок существа в свой ход, вы получаете 1 всплеск.                                                                                                                                                                                                                   |\n|         6         | Вы получаете преимущество на тесты Мощи и маневр Отталкивания.                                                                                                                                                                                                                                          |\n|  8 (4-й уровень)  | В первый раз, когда вы совершаете толчок существа в свой ход, вы получаете 2 всплеска.                                                                                                                                                                                                                  |\n| 10 (7-й уровень)  | Вы получаете двойное преимущество на тесты Мощи и маневр Отталкивания.                                                                                                                                                                                                                                  |\n| 12 (10-й уровень) | Всякий раз, когда вы используете героическую способность, вы получаете 10 очков временной выносливости. Дополнительно, всякий раз, когда вы делаете бросок силы, который накладывает принудительное движение на цель, расстояние принудительного движения получает бонус, равный показателю вашей Мощи. |\n\n###### Таблица Растущей свирепости Разорителя\n\n|    Свирепость     | Преимущество                                                                                                                                                                                                                                                                                                |\n| :---------------: | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n|         2         | Всякий раз, когда вы используете маневр Отталкивания, расстояние принудительного движения получает бонус, равный показателю вашей Ловкости.                                                                                                                                                                 |\n|         4         | В первый раз, когда вы совершаете швыряние существа в свой ход, вы получаете 1 всплеск.                                                                                                                                                                                                                     |\n|         6         | Вы получаете преимущество на тесты Ловкости и маневр Отталкивания.                                                                                                                                                                                                                                          |\n|  8 (4-й уровень)  | В первый раз, когда вы совершаете швыряние существа в свой ход, вы получаете 2 всплеска.                                                                                                                                                                                                                    |\n| 10 (7-й уровень)  | Вы получаете двойное преимущество на тесты Ловкости и маневр Отталкивания.                                                                                                                                                                                                                                  |\n| 12 (10-й уровень) | Всякий раз, когда вы используете героическую способность, вы получаете 10 очков временной выносливости. Дополнительно, всякий раз, когда вы делаете бросок силы, который накладывает принудительное движение на цель, расстояние принудительного движения получает бонус, равный показателю вашей Ловкости. |\n\n---\n"}, {"name": "Особенности аспекта 1-го уровня", "text": "#### Особенности аспекта 1-го уровня\nВаш первозданный аспект дает вам две особенности, как показано в таблице Особенностей аспекта 1-го уровня.\n###### Таблица особенностей аспекта 1-го уровня\n\n| Аспект      | Особенность                       |\n| ----------- | --------------------------------- |\n| Берсерк     | Комплект, Первозданная сила       |\n| Разоритель  | Комплект, Первозданная хитрость   |\n| Буревестник | Форма зверя, Безжалостный охотник |\n\n"}], [{"name": "Перк", "text": "#### Перк\nВы получаете один перк ремесла, исследования или интриги по вашему выбору. Смотрите [Перки](#/codex/1001).\n\n---\n"}, {"name": "Особенность аспекта 2-го уровня", "text": "#### Особенность аспекта 2-го уровня\nВаш первозданный аспект дает вам особенность, как показано в таблице Особенностей аспекта 2-го уровня.\n###### Таблица особенностей аспекта 2-го уровня\n\n| Аспект | Особенность |\n| ---------- | ----------------- |\n| Берсерк | Непреодолимая сила |\n| Разоритель | Неизбежный гнев |\n| Буревестник| Зуб и коготь |\n\n"}, {"name": "Неизбежный гнев", "text": "##### Неизбежный гнев\nУ вас есть бонус к скорости, равный показателю вашей Ловкости, и вы игнорируете труднопроходимую местность.\n"}, {"name": "Зуб и коготь", "text": "##### Зуб и коготь\nВ конце каждого вашего хода каждый враг, смежный с вами, получает урон, равный показателю вашей Мощи.\n"}, {"name": "Непреодолимая сила", "text": "##### Непреодолимая сила\nВсякий раз, когда вы используете действие атаки с рывком, вы можете использовать знаковую способность удара или героическую способность удара вместо свободного удара. Дополнительно, вы можете прыгнуть как часть вашего рывка.\n\n---\n"}, {"name": "Способность аспекта 2-го уровня", "text": "#### Способность аспекта 2-го уровня\nВаш первозданный аспект дает вам на выбор одну из двух героических способностей.\n"}], [{"name": "Особенность аспекта 3-го уровня", "text": "#### Особенность аспекта 3-го уровня\nВаш первозданный аспект дает вам особенность, как показано в таблице Особенностей аспекта 3-го уровня.\n###### Таблица особенностей аспекта 3-го уровня\n\n| Аспект | Особенность |\n| ---------- | ------------------------ |\n| Берсерк | Недвижимый объект |\n| Разоритель | Видеть сквозь их уловки |\n| Буревестник| Рыцарь природы |\n\n"}, {"name": "Недвижимый объект", "text": "##### Недвижимый объект\nВы добавляете свой уровень к вашему эффективному размеру для целей взаимодействия с существами и объектами, включая определение того, можете ли вы поднять объект, подвержены ли вы принудительному движению и так далее. Это не влияет на то, можете ли вы быть схвачены.\n\nДополнительно, у вас есть бонус к устойчивости, равный показателю вашей Мощи.\n"}, {"name": "Рыцарь природы", "text": "##### Рыцарь природы\nВы можете говорить с животными и элементалями. Дополнительно, вы автоматически ощущаете присутствие животных и элементалей в пределах 10 клеток от вас, даже если они скрыты.\n\nКогда вы ведете переговоры с животным или элементалем, вы считаете свою Славу на 1 выше, чем обычно. Это суммируется с увеличением вашей эффективной Славы на переговорах с животным вашего типа, находясь в форме животного (смотрите [Комплекты буревестника](#/codex/0924)).\n"}, {"name": "Видеть сквозь их уловки", "text": "##### Видеть сквозь их уловки\nВы имеете двойное преимущество на тесты, сделанные для поиска скрытых существ, распознавания скрытых мотивов или обнаружения лжи. У вас также есть двойное преимущество на тесты, сделанные для азартных игр!\n\n---\n"}, {"name": "Способность за 7 свирепости", "text": "#### Способность за 7 свирепости\nВыберите одну героическую способность из следующих вариантов, каждая из которых стоит 7 свирепости для использования.\n\n"}, {"name": "Демон на Воле", "text": "> **Демон на Воле (7 Свирепости)**\n>\n> *Враги трепещут при виде вас.*\n>\n> | **Магия** | **Маневр** |\n> | ----------- | -----------: |\n> | **📏 На себя** | **🎯 На себя** |\n>\n> **Эффект:** До конца боевой встречи или пока вы не окажетесь при смерти, каждый враг, который начинает свой ход смежным с вами и имеет П < СИЛЬНЫЙ, напуган до конца своего хода."}], [{"name": "Увеличение характеристик", "text": "#### Увеличение характеристик\nВаши показатели Мощи и Ловкости каждый увеличивается до 3.\n\n---\n"}, {"name": "Урон от свирепости", "text": "#### Урон от свирепости\nВ первый раз, когда вы получаете урон в каждом раунде боя, вы получаете 2 свирепости вместо 1.\n\n---\n"}, {"name": "Улучшение растущей свирепости", "text": "#### Улучшение растущей свирепости\nВаша особенность Растущая свирепость предоставляет дополнительные преимущества, когда у вас есть 8 или более свирепости.\n\n---\n"}, {"name": "Перк", "text": "#### Перк\nВы получаете один перк по вашему выбору.\n\n---\n"}, {"name": "Первозданная настройка", "text": "#### Первозданная настройка\nПоскольку ваша свирепость проявляет элементальные силы, созданные Первозданным Хаосом, вы осознаете, как элементальная сила взаимодействует с окружающими. Вы автоматически чувствуете, имеет ли какое-либо существо в пределах 10 клеток иммунитет к урону или уязвимость к урону к кислоте, холоду, порче, огню, молнии, яду или звуку, узнавая, есть ли у них иммунитет или уязвимость, значение этого иммунитета или уязвимости, и конкретный тип урона. Дополнительно, вы автоматически ощущаете любой источник одного из этих типов урона в пределах 10 клеток, например огонь или источник элементальной силы.\n\n---\n"}, {"name": "Первозданный удар", "text": "#### Первозданный удар\nВы можете проявить свою свирепость непосредственно как элементальную силу, созданную Первозданным Хаосом. Как часть любого удара, вы можете потратить 1 свирепости, чтобы получить 1 всплеск, который должен быть использован для этого удара. Дополнительный урон, наносимый всплеском, может быть уроном кислотой, холодом, порчей, огнем, молнией, ядом или звуком (по вашему выбору).\n\n---\n"}], [{"name": "Особенность аспекта 5-го уровня", "text": "#### Особенность аспекта 5-го уровня\nВаш первозданный аспект дает вам особенность, как показано в таблице Особенностей аспекта 5-го уровня.\n###### Таблица особенностей аспекта 5-го уровня\n\n| Аспект | Особенность |\n| ---------- | ---------- |\n| Берсерк | Прыгун |\n| Разоритель | Раскованный |\n| Буревестник| Рожденный штормом |\n\n"}, {"name": "Прыгун", "text": "##### Прыгун\nВаша дистанция и высота прыжка удваиваются (смотрите [Виды движения](#/codex/1305)). Дополнительно, когда вы падаете, вы уменьшаете эффективную высоту вашего падения на количество клеток, равное дистанции вашего прыжка, для цели определения урона и того, приземлитесь ли вы лежачим (смотрите [Падение](#/codex/1305)). Вы не становитесь лежачим после падения и приземления на другое существо.\n"}, {"name": "Рожденный штормом", "text": "##### Рожденный штормом\nВы и каждый союзник в пределах 5 клеток от вас игнорируете негативные эффекты от ненастной погоды, такие как помехи или урон от окружающей среды. Дополнительно, вы можете использовать особенность Благословение удачной погоды, как если бы вы были проводником 1-го уровня (смотрите Особенность домена 1-го уровня в разделе Проводника).\n"}, {"name": "Раскованный", "text": "##### Раскованный\nВ начале вашего хода вы можете завершить любое состояние опутанности на вас. Дополнительно, у вас есть двойное преимущество на тесты, сделанные для побега из заключения.\n\n---\n"}, {"name": "Способность за 9 свирепости", "text": "#### Способность за 9 свирепости\nВыберите одну героическую способность из следующих вариантов, каждая из которых стоит 9 свирепости для использования.\n\n"}, {"name": "Ослабляющий Удар", "text": "> **Ослабляющий Удар (9 Свирепости)**\n>\n> *Вам нужен всего один удар, чтобы саботировать вашу цель.*\n>\n> | **Ближний, Удар, Оружие** | **Основное действие** |\n> | ------------------------- | ------------------: |\n> | **📏 Ближний 1** | **🎯 Одно существо** |\n>\n> **Бросок силы + Мощь:**\n>\n> - **≤11:** 10 + М урона; М < СЛАБЫЙ, замедление (до прох.)\n> - **12-16:** 14 + М урона; М < СРЕДНИЙ, замедление (до прох.)\n> - **17+:** 20 + М урона; М < СИЛЬНЫЙ, замедление (до прох.)\n>\n> **Эффект:** Находясь в состоянии замедления таким образом, цель получает 1 урон за каждую клетку, на которую она перемещается, включая принудительное движение."}], [{"name": "Мародер Первозданного Хаоса", "text": "#### Мародер Первозданного Хаоса\nПо мере того, как ваша связь с силой Первозданного Хаоса становится все сильнее, вы автоматически ощущаете любых элементальных существ или магические источники элементальной силы, такие как лужа лавы или озеро, пересекающееся с Квинтэссенцией, в пределах 1 мили от вас.\n\nДополнительно, вы можете разговаривать с элементальными существами, и когда вы находитесь в переговорах с элементалем, вы считаете свою Славу на 1 выше, чем обычно. Это суммируется с увеличением вашей эффективной Славы, обеспечиваемым особенностью аспекта Рыцарь природы (смотрите [Особенности 3-го уровня](#/codex/0803)). Когда любой элементаль впервые понимает что находится с вами в бою, если у него П < СРЕДНИЙ, он напуган вами (до прох.).\n\n---\n"}, {"name": "Первозданный портал", "text": "#### Первозданный портал\nКак основное действие вы можете коснуться магического источника элементальной силы и использовать его для создания портала в Квинтэссенцию. Затем вы можете использовать основное действие, чтобы телепортировать себя и любых согласных существ в пределах 10 клеток от вас через портал на безопасный остров в Квинтэссенции, или телепортироваться обратно. Вы можете поддерживать количество порталов, равное показателю вашей Мощи, каждый из которых ведет на один и тот же безопасный остров в Квинтэссенции. Если портал в вашей сети уничтожен, он больше не является частью сети. Вы можете удалить портал из вашей сети независимо от вашего расстояния до него, в том числе через разные миры (действие не требуется).\n\n(Исследование Квинтэссенции возможно с вашего острова, но постоянная безопасность не гарантируется.)\n\n---\n"}, {"name": "Перк", "text": "#### Перк\nВы получаете один перк ремесла, исследования или интриги по вашему выбору.\n\n---\n"}, {"name": "Способность аспекта 6-го уровня", "text": "#### Способность аспекта 6-го уровня\nВаш первозданный аспект дает вам на выбор одну из двух героических способностей.\n"}, {"name": "Способности Берсерка 6-го уровня", "text": "##### Способности Берсерка 6-го уровня\nВыберите одну из следующих способностей.\n\n"}, {"name": "Лавинный Удар", "text": "> **Лавинный Удар (9 Свирепости)**\n>\n> *Вы прыгаете и обрушиваетесь вниз, вызывая ударную волну, которая сносит врагов.*\n>\n> | **Магия** | **Маневр** |\n> | ----------- | -----------: |\n> | **📏 На себя** | **🎯 На себя** |\n>\n> **Эффект:** Вы прыгаете на максимальное расстояние прыжка и делаете один бросок силы, который нацелен на каждое существо, смежное с клеткой, где вы приземляетесь.\n>\n> **Бросок силы + Мощь:**\n>\n> - **≤11:** 4 урона; толчок 1\n> - **12-16:** 7 урона; толчок 2\n> - **17+:** 11 урона; толчок 3"}], [{"name": "Увеличение характеристик", "text": "#### Увеличение характеристик\nКаждая из ваших характеристик увеличивается на 1, до максимума 4.\n\n---\n"}, {"name": "Элементальная форма", "text": "#### Элементальная форма\nВы демонстрируете все более сильные признаки того, как сила Первозданного Хаоса течет внутри вас. Всякий раз, когда вы проявляете сильные эмоции или увеличиваете свою свирепость, элементальные пылинки, настроенные на ваше настроение, порхают вокруг вас, и ваша кожа меняет внешний вид, отражая элемент по вашему выбору.\n\nДополнительно, если вы берсерк или разоритель, у вас есть иммунитет к урону кислотой, холодом, порчей, огнем, молнией, ядом и звуком, равный показателю вашей Мощи. Если вы буревестник, у вас есть иммунитет к типу урона вашей особенности Первозданный шторм, равный двойному показателю вашей Мощи.\n\n---\n"}, {"name": "Великая свирепость", "text": "#### Великая свирепость\nКогда вы получаете свирепость в начале каждого вашего хода во время боя, вы получаете 1d3 + 1 свирепости вместо 1d3.\n\n---\n"}, {"name": "Улучшение растущей свирепости", "text": "#### Улучшение растущей свирепости\nВаша Особенность Растущая свирепость предоставляет дополнительные преимущества, когда у вас есть 10 или более свирепости.\n\n---\n"}, {"name": "Навык", "text": "#### Навык\nВы получаете один навык по вашему выбору."}], [{"name": "Перк", "text": "#### Перк\nВы получаете один перк по вашему выбору.\n\n---\n"}, {"name": "Особенность аспекта 8-го уровня", "text": "#### Особенность аспекта 8-го уровня\nВаш первозданный аспект дает вам особенность, как показано в таблице Особенностей аспекта 8-го уровня.\n###### Таблица особенностей аспекта 8-го уровня\n\n| Аспект | Особенность |\n| ---------- | ------------------ |\n| Берсерк | Сильнейший |\n| Разоритель | На шаг впереди |\n| Буревестник| Зверинец |\n\n"}, {"name": "Зверинец", "text": "##### Зверинец\nВы можете использовать все комплекты буревестника. Во время отдыха вы можете выбрать смену своего комплекта буревестника и при этом взять еще одну деятельность отдыха. Ваша Особенность Рыцарь природы теперь позволяет вам автоматически ощущать присутствие животных в пределах 1 мили от вас. Дополнительно, всякий раз, когда вы проходите тест на выслеживание другого существа, вы можете бросить три кубика и выбрать, какие два использовать.\n"}, {"name": "На шаг впереди", "text": "##### На шаг впереди\nВы двигаетесь с легендарной грацией. Всякий раз, когда вы делаете тест Ловкости, вы можете бросить три кубика и выбрать, какие два использовать. Дополнительно, всякий раз, когда вы используете Действие отхода, расстояние, на которое вы можете сместиться, получает бонус, равный показателю вашей Ловкости.\n"}, {"name": "Сильнейший", "text": "##### Сильнейший\nВаша сила не имеет себе равных. Всякий раз, когда вы делаете тест Мощи, вы можете бросить три кубика и выбрать, какие два использовать. Дополнительно, всякий раз, когда вы используете маневр Отталкивания, расстояние принудительного движения получает бонус, равный показателю вашей Мощи.\n\n---\n"}, {"name": "Способность за 11 свирепости", "text": "#### Способность за 11 свирепости\nВыберите одну героическую способность из следующих вариантов, каждая из которых стоит 11 свирепости для использования.\n\n"}], [{"name": "Предвестник Первозданного Хаоса", "text": "#### Предвестник Первозданного Хаоса\nВы можете создать временный источник элементальной силы в качестве деятельности отдыха. Этот источник элементальной силы сохраняется 24 часа после создания и может быть использован для создания портала в Квинтэссенцию с помощью вашей особенности Первозданный портал. Если вы делаете это, источник элементальной силы сохраняется до тех пор, пока портал поддерживается в вашей сети.\n\n---\n"}, {"name": "Способность аспекта 9-го уровня", "text": "#### Способность аспекта 9-го уровня\nВаш первозданный аспект дает вам на выбор одну из двух героических способностей.\n"}, {"name": "Способности Берсерка 9-го уровня", "text": "##### Способности Берсерка 9-го уровня\nВыберите одну из следующих способностей.\n\n"}, {"name": "Смерть Приходит За Всеми!", "text": "> **Смерть Приходит За Всеми! (11 Свирепости)**\n>\n> *Вы используете свое оружие, чтобы создать разрушительную ударную волну.*\n>\n> | **Область, Магия, Ближний, Оружие** | **Основное действие** |\n> | ------------------------------ | ----------------------------: |\n> | **📏 Взрыв 3** | **🎯 Каждый враг в области** |\n>\n> **Бросок силы + Мощь:**\n>\n> - **≤11:** 7 урона; толчок 3\n> - **12-16:** 10 урона; толчок 5\n> - **17+:** 15 урона; толчок 7\n>\n> **Эффект:** Если это принудительное движение заставляет цель пролететь сквозь объект, эта цель получает дополнительные 10 урона."}, {"name": "Первозданный Вихрь", "text": "> **Первозданный Вихрь (11 Свирепости)**\n>\n> *Вы направляете силу Первозданного Хаоса, чтобы притягивать к себе врагов.*\n>\n> | **Область, Магия, Ближний, Оружие** | **Основное действие** |\n> | ------------------------------ | ----------------------------: |\n> | **📏 Взрыв 3** | **🎯 Каждый враг в области** |\n>\n> **Бросок силы + Мощь:**\n>\n> - **≤11:** 3 урона; вертикальное притягивание 3\n> - **12-16:** 5 урона; вертикальное притягивание 5\n> - **17+:** 8 урона; вертикальное притягивание 7\n>\n> **Эффект:** Если это принудительное движение заставляет цель врезаться в вас, вы не получаете урона от столкновения, а цель получает урон, который вы получили бы."}, {"name": "Способности Разорителя 9-го уровня", "text": "##### Способности Разорителя 9-го уровня\nВыберите одну из следующих способностей.\n\n"}], [{"name": "Воплощение Хаоса", "text": "#### Воплощение Хаоса\nВаше владение элементальными силами защищает и ободряет вас. Если вы берсерк или разоритель, у вас есть иммунитет к урону кислотой, холодом, порчей, огнем, молнией, ядом и звуком, равный двойному показателю вашей Мощи. Если вы буревестник, ваш иммунитет к урону от вашей особенности Первозданный шторм (смотрите [Комплекты буревестника](#/codex/0924)) увеличивается до трехкратного показателя вашей Мощи.\n\nКогда любой элементаль или любое другое существо, чьи способности наносят урон кислотой, холодом, п
